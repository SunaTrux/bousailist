<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="持ち歩き・持ち出し・備蓄の防災用品と保管場所を管理するチェックリスト">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" id="meta-theme-color" content="#FAF6EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="防災リスト">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>わが家の防災リスト</title>
<script>
/* Apply a manually chosen theme before first paint (avoids a light/dark flash). */
try{var __t=localStorage.getItem("bousai-theme-pref");if(__t==="light"||__t==="dark"){document.documentElement.setAttribute("data-theme",__t);}}catch(e){}
</script>
<style>
  /* ---------- Theme tokens ----------
     color-scheme is declared (meta + CSS) so browsers with their own "auto dark" / "force dark"
     (Brave, Chrome, Samsung Internet...) leave the page alone and native controls match the theme. */
  :root{
    color-scheme: light dark;
    --paper:#FAF6EE; --card:#F2EDE0; --ink:#22303C; --ink-soft:#56666F; --line:#D6CDB9;
    --clay:#B5563C; --clay-soft:#EFDCD4;
    --amber:#9C6710; --amber-soft:#F1E3C7;
    --teal:#3A6F5F; --teal-soft:#DCE7DF;
    --on-accent:#FFFFFF;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1B2227; --card:#222B31; --ink:#EDE7DA; --ink-soft:#9AA9B1; --line:#39454C;
      --clay:#E08A6E; --clay-soft:#3C2B27;
      --amber:#E3AE5C; --amber-soft:#3B3123;
      --teal:#6BAE98; --teal-soft:#223330;
      --on-accent:#14191D;
    }
  }
  :root[data-theme="light"]{ color-scheme: light; }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --paper:#1B2227; --card:#222B31; --ink:#EDE7DA; --ink-soft:#9AA9B1; --line:#39454C;
    --clay:#E08A6E; --clay-soft:#3C2B27;
    --amber:#E3AE5C; --amber-soft:#3B3123;
    --teal:#6BAE98; --teal-soft:#223330;
    --on-accent:#14191D;
  }

  /* ---------- Base ---------- */
  *,*::before,*::after{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; background:var(--paper); }
  body{
    margin:0; padding:0; background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Yu Gothic",Meiryo,"Segoe UI",Roboto,sans-serif;
    line-height:1.5; overflow-x:hidden; -webkit-font-smoothing:antialiased;
  }
  #app{
    width:100%; max-width:480px; margin:0 auto; background:var(--paper);
    min-height:100vh; min-height:100dvh; padding-bottom:48px; overflow-x:hidden;
  }
  button{
    -webkit-appearance:none; appearance:none; background:none; border:0; padding:0; margin:0;
    font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; text-align:inherit;
    -webkit-tap-highlight-color:transparent;
  }
  button:active{ opacity:.7; }
  button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
  /* 16px keeps iOS Safari from zooming the page when a field is focused (a cause of "cut off on the right") */
  input[type="text"],textarea{
    -webkit-appearance:none; appearance:none; border-radius:0; font:inherit; font-size:16px; color:var(--ink);
    background:var(--paper); border:1px solid var(--line); padding:10px 12px; min-width:0; max-width:100%;
  }
  textarea{ width:100%; display:block; }
  input[type="file"]{ max-width:100%; font-size:14px; color:var(--ink-soft); }

  /* ---------- Header / overview ---------- */
  .header{ padding:16px 20px 10px; border-bottom:1px solid var(--line); }
  .header-top{ display:flex; align-items:center; gap:12px; }
  .app-shield{ flex:none; width:.95em; height:1.18em; }
  .app-title{ min-width:0; }
  @media (max-width:360px){ .header h1{ gap:6px; } .header .app-title{ font-size:15.5px; white-space:nowrap; } .app-shield{ width:.9em; } }
  .header h1{ display:flex; align-items:center; gap:8px; flex:1; min-width:0; font-size:22px; font-weight:900; margin:0; letter-spacing:.02em; overflow-wrap:anywhere; }
  .header p{ margin:4px 0 0; font-size:13px; color:var(--ink-soft); }
  .gear-btn{
    flex-shrink:0; display:flex; align-items:center; gap:6px; min-height:44px; padding:0 14px;
    border:1px solid var(--line); background:var(--card); border-radius:22px; font-size:13px; font-weight:700;
  }
  .notice{ display:flex; align-items:flex-start; gap:8px; padding:10px 8px 10px 20px; font-size:14px; line-height:1.6; background:var(--card); border-bottom:1px solid var(--line); }
  .notice-body{ flex:1 1 auto; min-width:0; overflow-wrap:anywhere; }
  .notice .btn{ flex-shrink:0; }
  .notice-x{ flex-shrink:0; width:44px; height:44px; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); }
  .banner{ margin:0; padding:10px 20px; font-size:13px; background:var(--clay-soft); border-bottom:1px solid var(--clay); }

  .overview{ touch-action:pan-y; transition:transform .18s ease, opacity .18s ease; padding:8px 20px 8px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:5px; }
  .ov-row{ display:flex; align-items:center; gap:10px; line-height:1.2; }
  .ov-label{ font-size:12px; font-weight:700; width:60px; flex-shrink:0; }
  .ov-track{ flex:1; min-width:0; height:6px; background:var(--card); border:1px solid var(--line); overflow:hidden; }
  .ov-fill{ height:100%; transition:width .3s ease; }
  .ov-count{ font-size:11px; color:var(--ink-soft); width:44px; text-align:right; flex-shrink:0; font-variant-numeric:tabular-nums; }
  .edit-ctl{ align-self:flex-start; max-width:100%; }
  .edit-open, .edit-close{ min-height:48px; padding-left:18px; padding-right:18px; }
  .link-btn{
    align-self:flex-start; min-height:44px; padding:0; font-size:13px; color:var(--ink-soft);
    text-decoration:underline; text-underline-offset:3px; overflow-wrap:anywhere;
  }

  /* ---------- Shared small controls ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:0 16px;
    border:1px solid var(--ink); background:var(--ink); color:var(--paper); font-size:14px; font-weight:700; border-radius:4px;
  }
  .btn-accent{ border-color:var(--accent,var(--ink)); background:var(--accent,var(--ink)); color:var(--on-accent); }
  .btn-danger{ border-color:var(--clay); background:var(--clay); color:var(--on-accent); }
  .btn-ghost{ border-color:var(--line); background:var(--paper); color:var(--ink); }
  .btn[disabled]{ opacity:.45; pointer-events:none; }
  .btn-row{ display:flex; flex-wrap:wrap; gap:8px; margin:0 0 10px; }
  .btn-row .btn{ flex:1 1 140px; }
  .icon-btn{
    flex-shrink:0; width:44px; height:44px; display:flex; align-items:center; justify-content:center;
    border-radius:10px; color:var(--ink-soft);
  }
  .icon-btn svg{ display:block; }

  /* ---------- Per-group editor ---------- */
  .loc-settings{ padding:16px 20px; border-bottom:1px solid var(--line); background:var(--card); }
  .field-title{ font-size:12px; font-weight:700; color:var(--ink-soft); margin:0 0 8px; }
  .desc-textarea{ min-height:84px; line-height:1.5; resize:vertical; margin-bottom:16px; }
  .loc-chips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .loc-chip{
    display:flex; align-items:center; gap:2px; max-width:100%; min-height:44px; padding:0 4px 0 2px; position:relative;
    border:1px solid var(--line); background:var(--paper); border-radius:6px; font-size:14px;
  }
  .loc-chip > span{ min-width:0; overflow-wrap:anywhere; }
  .loc-chip .chip-x{ width:40px; height:40px; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); }
  .loc-chip.renaming{ padding:4px 4px 4px 8px; gap:6px; flex-wrap:wrap; } .loc-chip.renaming .edit-input{ min-width:140px; }
  .loc-chip .chip-x svg{ width:18px; height:18px; }
  .chip-grip{ flex:none; width:26px; height:40px; display:flex; align-items:center; justify-content:center; background:none; color:var(--ink-soft); touch-action:none; cursor:grab; }
  .chip-grip svg{ width:14px; height:14px; }
  .loc-chip.chip-lift, .suggest-chip.chip-lift{ z-index:6; box-shadow:0 6px 18px rgba(0,0,0,.28); background:var(--paper); }
  .drop-b::before, .drop-a::after{ content:""; position:absolute; top:-2px; bottom:-2px; width:4px; border-radius:2px; background:var(--ink); }
  .drop-b::before{ left:-6px; } .drop-a::after{ right:-6px; }
  .suggest-chip{ position:relative; display:inline-flex; align-items:center; max-width:100%; padding:0 2px 0 2px; border:1px dashed var(--ink-soft); border-radius:22px; }
  .suggest-chip .suggest{ border:0; background:transparent; padding:0 2px 0 2px; font-size:14px; }
  .suggest-chip .suggest.on{ padding:0 12px 0 4px; }
  .suggest-chip.on{ border-style:solid; background:var(--card); }
  .suggest-chip .chip-x{ width:32px; height:40px; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); background:none; }
  .del-msg{ display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin:0 0 10px; padding:6px 8px 6px 12px; border:1px solid var(--line); border-radius:8px; background:var(--paper); font-size:13px; }
  .loc-chip.pending{ padding:6px 8px 6px 12px; flex-wrap:wrap; }
  .suggest-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .suggest{ min-height:44px; padding:0 14px; border:1px dashed var(--ink-soft); border-radius:22px; background:transparent; color:var(--ink); font-size:15px; max-width:100%; overflow-wrap:anywhere; }
  .suggest.on{ display:inline-flex; align-items:center; border-style:solid; border-color:var(--ink-soft); background:var(--card); color:var(--ink-soft); }
  .add-line{ display:flex; gap:8px; }
  .add-line input{ flex:1 1 auto; min-width:0; }
  .add-line .btn{ flex-shrink:0; }

  /* ---------- Tabs / description / view toggle ---------- */
  .tabs{ display:flex; border-bottom:1px solid var(--line); }
  .tab{ flex:1; min-width:0; padding:8px 4px 7px; text-align:center; position:relative; color:var(--ink-soft); }
  .tab .stamp{
    width:auto; min-width:48px; height:32px; padding:0 10px; box-sizing:border-box; border-radius:16px; border:2px solid currentColor; margin:0 auto 4px; width:max-content;
    display:flex; align-items:center; justify-content:center; font-weight:900; font-size:14px; white-space:nowrap;
  }
  .tab .stamp svg{ width:21px; height:21px; display:block; }
  .tab .tlabel{ display:inline-flex; align-items:center; justify-content:center; gap:4px; font-size:12px; font-weight:700; }
  .tab .tlabel svg{ width:16px; height:16px; flex:none; }
  .tab.active{ color:var(--ink); }
  .tab.active::after{ content:''; position:absolute; left:0; right:0; bottom:-1px; height:3px; background:var(--accent,var(--ink)); }
  .tab.active .stamp{ background:var(--accent-soft,var(--card)); border-color:var(--accent,var(--ink)); }
  .group-desc{
    padding:8px 20px 6px; font-size:14px; color:var(--ink-soft); line-height:1.7; background:var(--card);
    border-bottom:1px solid var(--line); border-left:4px solid var(--accent,var(--ink)); overflow-wrap:anywhere;
  }
  .desc-link{ margin-top:0; }
  .text-link{ display:inline-block; min-height:32px; padding:6px 0 4px; background:none; color:var(--ink); font-size:14px; font-weight:700; text-decoration:underline; text-underline-offset:3px; }
  .view-toggle{ position:relative; display:flex; border-bottom:1px solid var(--line); }
  .vt-link{ position:absolute; left:50%; top:50%; width:24px; height:24px; margin:-12px 0 0 -12px; border-radius:50%; border:1px solid var(--line); background:var(--paper); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; pointer-events:none; z-index:1; }
  .vt-link svg{ width:14px; height:14px; }
  .link-note{ margin:8px 0 0; font-size:12.5px; line-height:1.6; color:var(--ink-soft); }
  .link-note .ln-ic{ display:inline-block; vertical-align:-3px; margin-right:4px; color:var(--ink); }
  .link-note .ln-ic svg{ width:16px; height:16px; }
  .view-toggle button svg{ width:18px; height:18px; flex:none; }
  .view-toggle button{ display:flex; align-items:center; justify-content:center; gap:6px; flex:1; min-height:44px; text-align:center; background:var(--card); font-size:13px; font-weight:700; color:var(--ink-soft); }
  .view-toggle button.active{ background:var(--paper); color:var(--ink); box-shadow:inset 0 -3px 0 var(--accent,var(--ink)); }

  /* ---------- Items ---------- */
  .items{ padding:0 20px; }
  .item{ border-bottom:1px solid var(--line); }
  .swipe-wrap{ position:relative; overflow:hidden; }
  .swipe-del{
    position:absolute; top:0; right:0; bottom:0; width:88px; display:flex; align-items:center; justify-content:center;
    background:var(--clay); color:var(--on-accent); font-size:15px; font-weight:700; text-align:center;
  }
  .swipe-content{
    position:relative; background:var(--paper); padding:6px 0 12px; touch-action:pan-y; transform:translateX(0);
    transition:transform .2s ease; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  .swipe-content.dragging{ transition:none; }
  .edit-plain{ position:relative; background:var(--paper); padding:6px 0 12px; }
  /* 閉じているときは、裏のボタンを見せない(画面の拡大率によって、行の境界線に1pxはみ出して見えるため) */
  .swipe-wrap:not(:has(.swipe-content.open, .swipe-content.open-l, .swipe-content.dragging)) > .swipe-del,
  .swipe-wrap:not(:has(.swipe-content.open, .swipe-content.open-l, .swipe-content.dragging)) > .swipe-pin{ visibility:hidden; transition:visibility 0s linear .3s; }
  .swipe-content.open{ transform:translateX(-88px); }
  .swipe-content.open-l{ transform:translateX(88px); }
  .swipe-pin{
    position:absolute; top:0; left:0; bottom:0; width:88px; display:flex; align-items:center; justify-content:center;
    background:var(--teal); color:var(--on-accent); font-size:15px; font-weight:700; text-align:center;
  }
  .item-top{ display:flex; align-items:center; gap:2px; min-height:48px; }
  .row-btn{ width:34px; height:48px; border-radius:8px; }
  @media (max-width:360px){ .row-btn{ width:30px; } .item-top{ gap:0; } .item-top .drag-handle{ width:28px; } }
  /* スマホの横向き: 画面を広く使い、用品を2列に並べる(並べ替えのドラッグは縦1列の前提なので、横向きでは持ち手を隠す) */
  @media (orientation:landscape) and (max-height:520px) and (min-width:560px){
    #app{ max-width:none; }
    .items{ display:grid; grid-template-columns:1fr 1fr; column-gap:28px; align-items:start; }
    .loc-group{ display:grid; grid-template-columns:1fr 1fr; column-gap:28px; align-content:start; }
    .loc-group > .loc-group-title, .loc-group > .loc-head, .loc-group > .note{ grid-column:1 / -1; }
    .pins .pin-list{ display:grid; grid-template-columns:1fr 1fr; gap:8px 28px; }
    .item-top .drag-handle{ display:none; }
  }
  /* 広い画面(パソコン・タブレット・スマホ横): 画面の幅に合わせて、用品を自動で段組みにする。
     並べ替えのドラッグは縦1列の前提なので、段組みのあいだは持ち手を隠す */
  @media (min-width:760px){
    body{ background:var(--card); }
    #app{ max-width:1200px; border-left:1px solid var(--line); border-right:1px solid var(--line); }
    .header{ padding:20px 28px 12px; }
    .overview{ flex-direction:row; gap:28px; padding:12px 28px; }
    .ov-row{ flex:1 1 0; min-width:0; }
    .group-desc{ padding-left:28px; padding-right:28px; }
    .filter-bar{ padding-left:28px; padding-right:28px; }
    .filter-bar .fb-search.has-q{ max-width:240px; }
    .items{ padding:0 28px; display:grid; grid-template-columns:repeat(auto-fill, minmax(460px, 1fr)); column-gap:56px; align-items:start; }
    .loc-group{ padding:0 28px 16px; display:grid; grid-template-columns:repeat(auto-fill, minmax(460px, 1fr)); column-gap:56px; align-content:start; }
    .loc-group > .loc-group-title, .loc-group > .loc-head, .loc-group > .note{ grid-column:1 / -1; }
    #app .pins{ padding-left:28px; padding-right:28px; }
    .pins .pin-list{ display:grid; grid-template-columns:1fr 1fr; gap:5px 28px; }   /* ピン留めは横に長いので、いつも2列(下の基本の指定より強くする) */
    .add-row{ padding-left:28px; padding-right:28px; max-width:640px; }
    .items .item-top .drag-handle{ display:none; }
  }
  @media (min-width:760px), (orientation:landscape) and (min-width:540px){
    #app.is-settings{ max-width:1100px; }
    .set-wide{ display:grid; grid-template-columns:300px minmax(0,1fr); gap:24px; padding:20px 28px 8px; align-items:start; }
    .set-nav{ position:sticky; top:12px; max-height:calc(100vh - 24px); overflow-y:auto; padding:8px; border:1px solid var(--line); border-radius:14px; background:var(--paper); }
    .set-nav-g{ padding:14px 10px 4px; font-size:11.5px; font-weight:900; letter-spacing:.08em; color:var(--ink-soft); }
    .set-nav-g:first-child{ padding-top:6px; }
    .set-nav-btn{ display:flex; align-items:center; gap:10px; width:100%; min-height:52px; padding:8px 10px; border-radius:10px; background:transparent; color:var(--ink); text-align:left; }
    .set-nav-btn:hover{ background:var(--line); }
    .set-nav-btn.on{ background:var(--accent-soft, var(--line)); box-shadow:inset 3px 0 0 var(--ink); }
    .set-nav-btn.danger .acc-ic{ color:var(--clay); }
    .set-pane{ min-width:0; border:1px solid var(--line); border-radius:14px; background:var(--paper); }
    .set-pane-t{ display:flex; align-items:center; gap:10px; margin:0; padding:18px 20px 6px; font-size:18px; font-weight:900; }
    .set-pane .acc-body{ padding:6px 20px 24px; }
    .set-pane .acc-sub:first-child{ border-top:0; margin-top:10px; padding-top:0; }
    .set-pane.danger .set-pane-t{ color:var(--clay); }
    .set-wide + .version{ padding-top:16px; }
  }
  /* スマホ横向きなど、高さが足りない画面: 上の部分を低くして、用品の一覧を広く見せる */
  @media (orientation:landscape) and (max-height:520px){
    .header{ padding:8px 28px 6px; }
    .header h1{ font-size:18px; }
    .header p{ margin-top:2px; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #app .header-top .settings-open, .header .btn{ min-height:36px; }
    #app .pins{ padding-top:6px; padding-bottom:4px; }
    .pins-hint{ display:none; }
    .overview{ padding:6px 28px; }
    .tab{ display:flex; align-items:center; justify-content:center; gap:8px; padding:5px 4px 4px; }
    .tab .stamp{ margin:0; min-width:40px; height:26px; padding:0 8px; border-radius:13px; font-size:13px; }
    .tab .stamp svg{ width:17px; height:17px; }
    .group-desc{ padding-top:6px; padding-bottom:2px; font-size:12px; line-height:1.5; }
    .text-link{ min-height:30px; padding:4px 0 2px; }
    .view-toggle button{ min-height:36px; }
    .filter-bar{ padding-top:6px; padding-bottom:6px; }
  }
  /* ヒント文の開閉 */
  .fold-box{ position:relative; }
  .header .fold-box{ padding-right:34px; }
  .group-desc.fold-box{ padding-right:46px; }
  .fold-x{ position:absolute; top:-4px; right:-6px; width:40px; height:40px; display:flex; align-items:center; justify-content:center; background:none; color:var(--ink-soft); }
  .group-desc .fold-x{ top:2px; right:4px; }
  .fold-x svg{ width:18px; height:18px; transform:rotate(-90deg); }
  .fold-row{ margin-top:2px; }
  .view-fold.view-note{ padding:4px 20px 0; margin:0; }
  .loc-group > .view-fold{ grid-column:1 / -1; margin:0; padding:4px 0 0; }
  .view-note.fold-box{ padding-right:48px; }
  .view-note .fold-x{ top:4px; right:14px; }
  .loc-note.fold-box{ padding:12px 34px 4px 0; margin:0; }
  .loc-note .fold-x{ top:4px; right:-6px; }
  @media (min-width:760px){ .view-fold.view-note{ padding-left:28px; padding-right:28px; } .view-note .fold-x{ right:22px; } }
  .fold-btn{ display:inline-flex; align-items:center; gap:2px; min-height:32px; padding:0 8px 0 0; background:none; color:var(--ink-soft); font-size:12px; font-weight:700; }
  .fold-btn svg{ width:16px; height:16px; flex:none; }
  .group-desc.closed{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding-top:2px; padding-bottom:2px; }
  .group-desc.closed .desc-link{ margin:0; }

  .note{ font-size:13px; color:var(--ink-soft); line-height:1.7; margin:0 0 12px; overflow-wrap:anywhere; }
  .settings-btn{
    display:block; width:100%; min-height:48px; padding:0 14px; margin-bottom:10px; text-align:left;
    border:1px solid var(--line); background:var(--card); font-size:15px; font-weight:700; border-radius:4px;
  }
  a.settings-btn{ display:flex; align-items:center; justify-content:center; color:var(--ink); text-decoration:none; }
  .seg{ display:flex; gap:8px; }
  .seg button{
    flex:1; min-height:46px; padding:0 4px; text-align:center; border:1px solid var(--line); background:var(--card);
    color:var(--ink-soft); font-size:13px; font-weight:700; border-radius:6px;
  }
  .seg button.active{ background:var(--ink); border-color:var(--ink); color:var(--paper); }
  .panel{ margin:0 0 14px; }
  .code-box{ min-height:140px; max-height:260px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; line-height:1.5; white-space:pre; overflow:auto; resize:vertical; margin-bottom:10px; }
  .msg{ padding:10px 12px; margin:8px 0; font-size:13px; line-height:1.6; border-radius:4px; background:var(--teal-soft); border-left:4px solid var(--teal); overflow-wrap:anywhere; }
  .msg.error{ background:var(--clay-soft); border-left-color:var(--clay); }
  .msg.warn{ background:var(--amber-soft); border-left-color:var(--amber); }
  .preview{ margin:12px 0; border:1px solid var(--line); border-radius:6px; background:var(--card); overflow:hidden; }
  .preview h3{ margin:0; padding:12px 14px; font-size:14px; border-bottom:1px solid var(--line); }
  .pv-group{ padding:12px 14px; border-bottom:1px solid var(--line); font-size:13.5px; overflow-wrap:anywhere; }
  .pv-group:last-child{ border-bottom:0; }
  .pv-head{ font-weight:900; margin-bottom:6px; }
  .pv-head small{ font-weight:500; color:var(--ink-soft); margin-left:6px; }
  .pv-line{ margin:4px 0 0; line-height:1.6; }
  .tag{ display:inline-block; min-width:3.2em; margin-right:6px; padding:0 6px; font-size:12px; font-weight:700; text-align:center; border-radius:3px; color:var(--on-accent); }
  .tag.add{ background:var(--teal); } .tag.upd{ background:var(--amber); } .tag.del{ background:var(--clay); }
  .tag.keep{ background:var(--ink-soft); }
  .danger-zone .settings-title{ color:var(--clay); }
  .pack-tools{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .pack-actions{ display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .pack-panel{ margin-top:12px; padding:12px; border:1px solid var(--line); border-radius:6px; background:var(--card); }
  .set-card{ border:1px solid var(--line); border-radius:6px; background:var(--card); margin:0 0 8px; overflow:hidden; }
  .set-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; min-height:48px; padding:8px 14px; background:none; border:0; color:var(--ink); font:inherit; font-weight:700; text-align:left; cursor:pointer; }
  .set-t small{ margin-left:8px; font-weight:500; font-size:12.5px; color:var(--ink-soft); }
  .set-head[aria-expanded="true"] .acc-ch{ transform:rotate(90deg); }
  .set-body{ padding:0 14px 14px; border-top:1px solid var(--line); padding-top:10px; }
  .set-list{ list-style:none; margin:0; padding:0; }
  .set-row{ display:flex; align-items:center; gap:10px; width:100%; min-height:44px; padding:4px 0; background:none; border:0; color:var(--ink); font:inherit; font-size:15px; text-align:left; cursor:pointer; }
  .set-row.done{ color:var(--ink-soft); cursor:default; }
  .set-name{ flex:1; min-width:0; overflow-wrap:anywhere; }
  .set-cat{ font-size:12px; color:var(--ink-soft); white-space:nowrap; }
  .btn:disabled{ opacity:.45; cursor:default; }
  .refs{ margin:0; padding-left:1.2em; font-size:14px; line-height:1.8; overflow-wrap:anywhere; }
  .refs a{ color:var(--ink); text-decoration:underline; }
  .version{ padding:20px 20px 4px; text-align:center; font-size:13px; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
  .version b{ color:var(--ink); }
</style>
</head>
<body>

<script>
(function(){

   Bump on every release. Keep service-worker.js CACHE_NAME in step. */
var APP_VERSION = "1.59.0";

/* 更新のお知らせ用。新しい版を上に足す(1版あたり2〜3行) */
var RELEASE_NOTES = [
  { v:"1.59.0", lines:["アプリのタイトルの先頭に、ホーム画面のアイコンと同じ青い盾を付けました。"] },
  { v:"1.58.1", lines:["書き出しの「ファイルをダウンロード」などのボタン名を、2行にならないよう「ダウンロード」に短くしました。"] },
  { v:"1.58.0", lines:["ホーム画面のアイコンを、青い盾にチェックマークのデザインに変えました。すでにホーム画面にあるアイコンは、いったん削除して、もう一度「ホーム画面に追加」すると新しくなります。"] },
  { v:"1.57.1", lines:["防災用品マスタと拡張パックの検索窓に、虫めがねのアイコンと、右端の入力クリアボタンをつけました。"] },
  { v:"1.57.0", lines:["設定の「拡張パック」に、検索窓をつけました。パック名や用品名で探せて、合うパックは開いて、合う用品に色がつきます。ひらがな・カタカナの違いは区別せずに探します。"] },
  { v:"1.56.0", lines:["設定の「防災用品マスタ」に、用品名の検索窓をつけました。用品がすでにあるか調べるときに使えます。ひらがな・カタカナの違いは区別せずに探します。","「持ち歩きEx」に、「日焼け止め」「折りたたみ傘(晴雨兼用)」を追加しました。"] },
  { v:"1.55.0", lines:["入れられる数の上限を整理しました(用品は各フェーズ500件、保管場所は30個、用品名は100文字、場所名は30文字、自分のパックは20個・1パック100件まで)。上限に達したときは、黙って止まらずに、メッセージを出すようにしました。ヘルプの「データのこと」にも書きました。"] },
  { v:"1.54.4", lines:["用品の追加欄の入力例を、すでにある「携帯充電器」から「推しの写真」に変えました。"] },
  { v:"1.54.3", lines:["検索窓の右端に、小さなクリアボタンをつけました。1回タップすると、入力した内容を消せます。"] },
  { v:"1.54.2", lines:["検索窓に日本語を入力している途中、文字が虫めがねの上に重なって見えていたのを直しました。"] },
  { v:"1.54.1", lines:["「どこにある？」の「配置済」で出る「場所未定」の説明は、場所未定に用品が1つ以上あるときだけ出すようにしました。"] },
  { v:"1.54.0", lines:["上の進捗バーを、左にスワイプすると非表示にできるようにしました。もう一度出すときは、設定の「進捗バー」で選びます。","アプリのヒント文の初期の文を、「持ち歩き・持ち出し・備蓄の3つのフェーズで防災用品をそろえよう。備えておく場所を決めたらチェック。」に変えました(自分で書き換えた文はそのままです)。"] },
  { v:"1.53.0", lines:["持ち出しの初期の用品を分けました。「不織布マスク😷」「手指消毒」「体温計」、「雨具」「防寒着」、「缶切り」「ライター」「ナイフ」です。いま使っているリストでは、変更していない用品だけが、チェックを引き継いで分かれます。","備蓄の「衛生用品(生理用品・水のいらないシャンプー)」を「水のいらないシャンプー」にしました。","備蓄の初期の保管場所を、「キッチン」「洗面所」にしました。「リビング」は候補に移しました(いまの保管場所は、リビングに置いたものがなければ入れ替わります)。"] },
  { v:"1.52.0", lines:["「場所未定」を、いつも保管場所の一番最後に表示する固定の場所にしました。保管場所の編集画面には出さず、名前の変更・削除・並べ替えはできません。","保管場所を追加しても、「場所未定」は最後のままです。"] },
  { v:"1.51.0", lines:["iPhoneで、用品名の入力中に文字の変換(カタカナ・漢字)の候補が出ない問題を、バンドマン持ち物リストと同じ入力欄の作りにそろえて直しました。","用品名を編集している間は、行をスワイプ用の枠から外し、入力欄をふつうの入力欄にしました。"] },
  { v:"1.50.9", lines:["iPhoneで、用品名などを入力したとき、文字の変換(カタカナ・漢字)の候補が出ない問題を、もう一度直しました。入力欄が「文字を選べない」設定の領域の中にあったため、入力欄だけ選べるようにしました。"] },
  { v:"1.50.8", lines:["iPhoneで、用品名などの日本語入力のあと、カタカナなどに変換できない問題を直しました。入力欄に連絡先の自動入力が出て、変換候補をふさいでいたため、自動入力が出ないようにしました。","変換の確定のEnterで、編集が意図せず確定されることがないようにしました。"] },
  { v:"1.50.7", lines:["「どこにある？」の「配置済」の表示では、用品に取り消し線をつけないようにしました。場所ごとに何があるかを見やすくするためです。","アプリのヒント文の初期の文を、「持ち歩き・持ち出し・備蓄の3つのフェーズで防災用品をそろえよう。保管場所まで決めたらチェック。」に変えました(自分で書き換えた文はそのままです)。"] },
  { v:"1.50.6", lines:["ヘルプの特徴の順番を、「初期の用品は公的資料にもとづく」が先頭、「拡張パック」が2番目になるように入れ替えました。"] },
  { v:"1.50.5", lines:["ヘルプの「どんなアプリ？」に、アプリの特徴を追加しました。拡張パックで自分なりに用品を増やして、おすすめを家族や友だちに送れること、初期の用品が東京都防災ホームページなどの公的資料にもとづいていることです。"] },
  { v:"1.50.4", lines:["アプリのヒント文の初期の文を、「持ち歩き・持ち出し・備蓄の3つのフェーズで防災用品をそろえよう。どこにあるかを決めておこう。」に変えました(自分で書き換えた文はそのままです)。","ヘルプを見直し、重なっていた説明をまとめ、いまの画面とちがう言い方を直しました。"] },
  { v:"1.50.3", lines:["感想を送るとき、使っている端末・ブラウザ・バージョンが自動で一緒に届くようにしました(入力は不要です)。"] },
  { v:"1.50.2", lines:["設定の感想ボタンの見た目を整え、名前を「感想を送る」に変えました。"] },
  { v:"1.50.1", lines:["パソコンやスマホ横で、ピン留めの用品を、いつも2列で並べるようにしました。"] },
  { v:"1.50.0", lines:["非表示にしていた用品をピン留めすると、表示に戻るようにしました。","パソコンの画面で、用品の列を広くして、見やすくしました(1列の幅を広げ、列のあいだも広げました)。","設定を整理しました。「書き出し・共有・バックアップ」は、自分用の「書き出し・バックアップ」になりました。新しい「コミュニケーション」に、「家族に共有」「友だちに紹介・パックを送る」「作者に感想を送る」を集めました。","タブの下の名前の横に、スニーカー・リュック・家のアイコンを付けました。"] },
  { v:"1.49.0", lines:["設定の「このアプリを友達に勧める」の下に、自分で作った拡張パックを送る欄を追加しました。パックを選んで「送る」を押すと、リンク付きのメッセージが作られます。リンクを開いた人は、アプリがそのまま開いて、パックを取り込めます。"] },
  { v:"1.48.0", lines:["作者に感想や不具合を送れるようにしました。設定の「感想・ご意見を送る」から、フォームを開けます(バンドマン持ち物リスト、プレイヤーズセットリストと同じフォームで、このアプリが自動で選ばれます)。"] },
  { v:"1.47.0", lines:["自分で作った拡張パックを、家族や友だちに簡単に送れるようにしました。設定の「拡張パック」で、自分のパックの「友だちに送る」を押すと、リンク付きのメッセージが作られます(LINEなどの送る画面が開きます)。","もらった人は、リンクを開くと「パックが届きました」と出るので、「リストに追加する」を押すだけで取り込めます。ホーム画面のアプリで使っている人は、メッセージ全体を「もらったパックを取り込む」に貼り付けられます。"] },
  { v:"1.46.1", lines:["「どこにある？」の「場所未定」の見出しを、ほかの場所と区別できるように、グレーにしました。"] },
  { v:"1.46.0", lines:["「どこにある？」は、開くたびに「配置済」の絞り込みから始まるようにしました(「すべて」「未配置」にも切り替えられます)。用品の画面の絞り込みは、戻ったときに元へ戻ります。","「配置済」のときは、一番下に「場所未定にあるのは、持っているけれど、どこに置いておくかはまだ決めていない用品です」と案内を出します。"] },
  { v:"1.45.1", lines:["絞り込みの名前を、「未チェック」→「未配置」、「チェック済」→「配置済」に変えました。用品の画面と「どこにある？」の画面で、同じ言葉(すべて／未配置／配置済)で揃えています。"] },
  { v:"1.45.0", lines:["「どこにある？」で、チェック済の用品だけを見られるようにしました。絞り込みバーの「チェック済」を押すと、チェックした用品だけが場所ごとに並びます(「場所未定」の絞り込みは、用品の画面だけになりました)。"] },
  { v:"1.44.0", lines:["場所の「未定」を、「場所未定」に戻しました(絞り込みも「場所未定」)。これまでのチェックはそのまま引き継ぎます。"] },
  { v:"1.43.3", lines:["「場所を編集」のボタンを、絞り込みバーの右側(目と虫めがねの間)の、小さな鉛筆ボタンに変えました。押すと、その下に編集パネルが開きます。","「どこにある？」の一番下にあったボタンも、同じ鉛筆に集約しました。"] },
  { v:"1.43.2", lines:["ボタンの名前を「場所を編集」に変えました。","スマホの画面の拡大率によって、用品の行の境界線が途中で欠けて見えることがあったのを直しました。"] },
  { v:"1.43.1", lines:["設定の「表示」に「進捗バー」を追加しました。画面上部の進捗欄を、表示する／非表示にする から選べます。"] },
  { v:"1.43.0", lines:["保管場所を、用品ごとではなく、次(0次・1次・2次)ごとに共通にしました。どの用品も、その次のすべての場所の箱が並びます。","場所の追加・名前の変更・削除・並べ替えは、用品の一覧の一番上の「保管場所を追加・編集」にまとめました。用品ごとの鉛筆はなくなりました。","これまで用品ごとに絞っていた場所は、その次の場所に揃います(チェックは残ります)。"] },
  { v:"1.42.1", lines:["パソコンでも、用品の行のピン留め・非表示のアイコンを出さないようにしました。マウスのドラッグ(左で非表示、右でピン留め)で操作できます。"] },
  { v:"1.42.0", lines:["タブの印を「0」「1」「2」から、「0次」「1次」「2次」に変えました。","各次のタブの下にあったヒント枠をなくしました。説明文はヘルプの「0次・1次・2次の3つの区分」に移し、書き換えは設定の「ヒント文」から行えます。"] },
  { v:"1.41.0", lines:["ヒント文を整理しました。「防災用品」「どこにある？」タブごとの使い方の文をなくし(ヘルプの「2つのタブ」に移しました)、区分のヒント枠に、「2つのタブは同じリストの見方で、チェックは連動する」「持ち歩き・持ち出し・備蓄は別のリスト」という説明を加えました。","切り替えタブの真ん中に、連動を示す⇄の印を入れました。"] },
  { v:"1.40.0", lines:["保管場所の編集画面に、「初期の保管場所を戻す」ボタンを追加しました。消してしまった初期の保管場所(バッグA・リュックA・未定など)だけを元の並びの位置に戻し、自分で作った保管場所はそのまま残ります。すべての場所に置く設定の用品には、戻した場所も加えます。"] },
  { v:"1.39.4", lines:["「場所未定」の名前を「未定」に変えました(保管場所・絞り込み・ヒント文・ヘルプ)。これまでの「場所未定」は、チェックを引き継いで「未定」になります。"] },
  { v:"1.39.3", lines:["用品名の編集欄を、連番の位置からではなく、いまの用品名と同じ位置から始まるようにしました(連番はそのまま表示します)。"] },
  { v:"1.39.2", lines:["用品名を、ダブルタップではなく、1回タップするだけで編集できるようにしました(スワイプが開いているときは、まず閉じます)。"] },
  { v:"1.39.1", lines:["用品名の行の鉛筆アイコンをなくしました。用品名をダブルタップ(パソコンではダブルクリック)すると、用品名を編集できます。"] },
  { v:"1.39.0", lines:["初期の用品名を変えました: 「ホイッスル」→「エマージェンシーホイッスル」、「ライト」→「小型LEDライト」、「マスク」→「不織布マスク」(持ち歩き)、「毛布」→「エマージェンシーブランケット」(持ち出し)。","初期の保管場所を変えました: 持ち歩き=バッグA・バッグB、持ち出し=リュックA・リュックB、備蓄=リビング・キッチン(それぞれ「場所未定」つき)。初期のままだった場所は、これまでの用品の置き場所やチェックを引き継いで変わります。外れた場所は、候補から追加できます。","「場所未定」にチェックすると、ほかの場所のチェックははずれ、押せなくなります。場所未定のチェックをはずすと、また押せます。","「職場に保管セット」を追加するとき、「職場に保管」の保管場所がなければ自動で加えるようにしました。"] },
  { v:"1.38.0", lines:["「場所未定」も、場所のひとつとして最初から並ぶようにしました(ほかの場所と同じように、チェック・名前の変更・削除ができます)。","どこか1つでも場所(場所未定を含む)にチェックが入った用品を、準備済みとして数え、進捗バーに反映するようにしました。","用品名の左の印を、ただの連番にしました(チェックの影響を受けません)。","絞り込みの「場所未定」は、「場所未定」にチェックしている用品だけを表示します。"] },
  { v:"1.37.0", lines:["初期の保管場所が、用品の下に最初から並ぶようにしました。用意できたら、場所の箱にチェックするだけで使えます(新しく追加した用品も、パックから追加した用品も同じです)。これまで場所を決めていなかった用品も、並んでいる場所すべてに置く用品にそろえました(準備済みだった用品は、すべてにチェック済みです)。","場所の「＋」を鉛筆に変えました。鉛筆から、用品の置く場所の選び直しと、保管場所の名前の変更・追加・削除・並べ替え、候補からの追加ができます。","保管場所の名前を変えると、すべての用品の場所にも反映されます。"] },
  { v:"1.36.0", lines:["用品の下の場所チップをやめて、置く場所を「箱＋場所名」で横に並べる形にしました。用意できたら、その場所の箱にチェックします(チェックのたびに進捗バーが進みます)。","置く場所は、用品の右の「＋」で選びます。選んだ場所だけが並び、選んでいない場所は出ません。保管場所そのものの追加・並べ替え・削除も、「＋」の中からできます。","場所を決めていない用品は「場所未定」の箱が出ます。用品名の左の丸は、準備の状況を示すだけの印にしました(タップはできません。場所の一部だけそろったときは「1/2」のように表示します)。"] },
  { v:"1.35.2", lines:["「防災用品」タブと「どこにある？」タブのヒント文を、いまの使い方(用品は見出し・チェックは場所・場所ごとに進捗が進む)に合わせて書き直しました。"] },
  { v:"1.35.1", lines:["「場所未定」のチップも、ほかの場所と同じように、タップで枠線(用意する予定)→点灯(準備済み)→消灯の順に切り替わるようにしました。"] },
  { v:"1.35.0", lines:["用品を「見出し」の扱いにしました。用品名の左のチェックはなくし(準備済みかどうかの印だけ残しています)、チェックは場所のチップで行います。場所に用意できて点灯するたびに準備が進みます。","場所を決めていない用品には、「場所未定」のチップが出ます。場所は決めていないけれど準備した、というときは、これをタップします。","進捗バーを、用品の数ではなく場所の数で数えるようにしました(置く場所ごとに1つ。場所未定の用品は1つ)。"] },
  { v:"1.34.0", lines:["保管場所のチップと候補チップを、ドラッグで並べ替えられるようにしました(チップ左の点のマークをドラッグ。キーボードは左右キー)。","保管場所の✕を押すと、確認なしですぐ削除し、「削除しました」のメッセージと「元に戻す」ボタンを出すようにしました。用品に付けていた場所やそろった状態も、元に戻せます。","候補チップも✕で外せます(「元に戻す」可)。外した候補は「候補を初期の並びに戻す」で戻せます。"] },
  { v:"1.33.0", lines:["絞り込みを「すべて」「未チェック」「場所未定」の3つにしました。件数の表示はなくしました。「場所未定」は、保管場所をまだ決めていない用品だけを表示します(「どこにある？」タブでは、場所未定の用品だけが出ます)。"] },
  { v:"1.32.1", lines:["スマホを横向きにしたときの設定画面の左メニューが、画面の幅がせまい機種でも出るようにしました(横向きで幅540px以上)。"] },
  { v:"1.32.0", lines:["パソコン・タブレット・スマホ横向きなど広い画面では、設定画面の左側に項目のメニューが出るようにしました。左で項目を選ぶと、右側にその内容が表示されます(せまい画面はこれまでどおり開閉式です)。"] },
  { v:"1.31.0", lines:["設定画面を整理しました。見出しの先頭に線のアイコンをつけ、「使い方」「リスト」「表示」「データ」「アプリ」のまとまりに並べ直しました。","設定の一番上に「使い方・ヘルプ」を追加しました。アプリの特徴、主な使い方、便利な使い方例、データのこと、困ったときをまとめています。","「どこにある？」タブのヒント文の上の余白を、「防災用品」タブのヒント文とそろえました。"] },
  { v:"1.30.0", lines:["表示の切り替えの行を、文字を減らしてすっきりさせました。「表示」の文字をなくし、「全｜未 6」の切り替えにまとめました。「非表示」のチェックは目のアイコン(非表示の数つき)に、検索は虫めがねのアイコンだけにして、押すと入力欄が開きます。"] },
  { v:"1.29.0", lines:["設定に「このアプリを友達に勧める」を追加しました。アプリの名前・簡単な説明・URLを、LINEやメールなどで友達に送れます(送る前に文章を確認できます。送る画面が開けない端末では、文章のコピーになります)。"] },
  { v:"1.28.1", lines:["「防災用品」タブの説明文を、「場所を決めたらタップ（枠線）→ 場所に用意できたらタップ（点灯）→ さらにタップで場所未定（消灯）」に変えました。"] },
  { v:"1.28.0", lines:["設定の「拡張パック」で、自分のパックを作れるようになりました。パック名・追加先の区分・用品(1行に1つ)を入力するか、「今のリストからパックを作る」で登録済みの用品から選んで作れます。","自分のパックは「Markdownで書き出す」でLINEやメモに貼って渡せます。もらった文章は「もらったパックを取り込む」で内容を確認してから、自分のパックとして保存できます。","自分のパックは、JSONバックアップにも含まれます。"] },
  { v:"1.27.2", lines:["チップを枠線にしたときの案内を、「以降は表示しない」にチェックするまで毎回出るようにしました(「わかった」ボタンをチェックに変えました)。止めたあとも、設定の「ガイド」から戻せます。"] },
  { v:"1.27.1", lines:["設定に「ガイド」を追加しました。「ガイドをもう一度見る」を押すと、はじめての案内(チップを枠線にしたときの吹き出し)をもう一度表示できます。"] },
  { v:"1.27.0", lines:["初めて保管場所のチップを枠線にしたときだけ、「揃えられたら、もう一度タップしよう(点灯します)」と案内を出すようにしました。「わかった」を押すか、ほかの操作をすると消えます。2回目以降は出ません。"] },
  { v:"1.26.3", lines:["「防災用品」と「どこにある？」の説明文を、右の矢印で開け閉めできるようにしました。初期は閉じていて、開閉は覚えています。","「どこにある？」の説明文を「場所ごとに揃ったらチェック。全場所に揃うと進捗バーが進みます。」に変えました。"] },
  { v:"1.26.2", lines:["「保管場所未設定」の見出しを「場所未定」に変えました。","「防災用品」タブの説明文を、「場所を決めたらタップ(枠線)→場所に揃ったらタップ(点灯)→さらにタップすると消灯し、場所未定となります。」に変えました。"] },
  { v:"1.26.1", lines:["初期の保管場所を変えました。持ち歩き=「いつものバッグ」「サブバッグ」、備蓄=「リビング」「寝室」「キッチン」。ワンタップ追加の候補は、持ち歩き=「防災ポーチ」「衛生ポーチ」「通学バッグ」「通勤バッグ」、備蓄=「押し入れ」「ベランダ」「レンタル倉庫」です(すでにある保管場所は変わりません)。","ヒント文の言い回しを短くしました。"] },
  { v:"1.26.0", lines:["用品ごとに「必要な場所すべてにそろったら準備済み」を管理できるようにしました。保管場所のチップは、タップするたびに 置く場所(枠線)→そろった(塗りつぶし)→なし と切り替わります。","「どこにある？」の場所ごとのチェック(丸)は、その場所にそろったかどうかです。すべての場所にそろうと、「防災用品」タブのチェックが自動で付き、一部だけのときは途中の印(ー)になります。「防災用品」タブのチェックを押すと、すべての場所にそろった/なしをまとめて切り替えます。","CSVに「そろった場所」の列を追加しました。この列がない古いCSVは、チェックが済のとき全部そろった扱いで取り込みます。","以前のデータは、チェック済みの用品はすべての場所にそろった扱い、未チェックの用品は置く場所のみ(まだそろっていない)になります。"] },
  { v:"1.25.0", lines:["「どこにある？」を、保管場所ごとに用品を並べて見る画面にしました。チェックはすべて四角で、「防災用品」タブのチェック(用意できたか)と同じです。どちらで付けても連動し、進捗バーにも数えられます。","各場所には、その場所のチップを点灯させた用品だけが出ます(複数の場所にある用品は、それぞれに出ます)。どこにも置いていない用品は、一番下の「保管場所未設定」に出ます。","保管場所を決めるのは、「防災用品」タブのチップです(1.15.0の「その場所にあるかのチェック」は廃止しました)。"] },
  { v:"1.24.1", lines:["「どこにある？」で、保管場所のチップがひとつも点灯していない用品は、各場所の一覧には出さず、一番下の「保管場所未設定」だけに出すようにしました。保管場所を最初に決めるのは「防災用品」タブのチップです。"] },
  { v:"1.24.0", lines:["「どこにある？」の一番下に、「保管場所未設定」の見出しを追加しました。保管場所のチップがひとつも点灯していない用品が、ここに出ます。","ここのチェックは四角で、「防災用品」タブのチェック(用意できたか)と同じものです。ほかの場所の丸いチェック(その場所にあるか)とは別です。チップを点灯させると、この見出しから消えます。"] },
  { v:"1.23.0", lines:["設定の「追加セット」を「拡張パック」に、切り替えの「どこにあるか？」を「どこにある？」に変えました。","乳児用・高齢者用の用品名に「(乳児用)」「(高齢者用)」を付けて、ほかの用品と区別できるようにしました。","拡張パックに「持ち歩きEx(防犯ブザー)」「持ち出しEx(踏み抜き防止中敷き)」「備蓄Ex(ぬいぐるみ)」を追加しました。"] },
  { v:"1.22.0", lines:["持ち歩き・持ち出し・備蓄のヒント文の最後に鉛筆アイコンを付けました。押すとその場で編集できます(保存・キャンセル・初期の文に戻す)。右の矢印で閉じることもできます。","保管場所の編集を、画面の上ではなく、押した「＋」チップのすぐ下に開くようにしました。「どこにあるか？」の画面では、一覧の最後の「保管場所を追加・編集」から開きます。","「保管場所を編集」のリンクと、上に出ていた編集画面はなくなりました。"] },
  { v:"1.21.0", lines:["切り替えの名前を「防災用品」「どこにあるか？」に変えました。","「防災用品」タブにも、使い方のヒント文を付けました。","各用品の保管場所チップの一番後ろに「＋」を付けました。押すと保管場所の編集画面に移動し、「一覧に戻る」で元の位置に戻ります。"] },
  { v:"1.20.1", lines:["安全対策を強化しました。外部への通信や外部の読み込みを禁止する設定(CSP)を追加し、万一おかしな文字が入っても情報が外に送られないようにしました。","CSVの書き出しで、品名が「=」「+」「-」「@」で始まる場合に、Excelなどで数式として実行されないようにしました(取り込み時は元に戻ります)。"] },
  { v:"1.20.0", lines:["設定に「追加セット」を追加しました。「職場に保管セット」(非常食・常備薬・携帯電話の充電器の職場用)、「乳児用セット」、「高齢者用セット」を開いて、必要な用品だけ選んで「追加」できます。同じ名前の用品はすでにあれば追加されません。","設定の「参考にしたもの」に、東京都「帰宅困難者対策ハンドブック」と内閣府「特集 オフィスの防災」を追加しました。"] },
  { v:"1.19.2", lines:["持ち出しの初期の保管場所「職場置き」を「職場に保管」に変えました。","持ち出しの初期の用品に、「歩きやすい靴(職場用)」と「帰宅ルートの地図(職場用)」を追加しました。","すでにある保管場所・用品は変わりません(新規インストールと「初期化」のときに反映されます)。"] },
  { v:"1.19.1", lines:["備蓄の初期の用品「飲料水」の名前を、「飲料水(1人1日3L)」に変えました。すでにある用品の名前は変わりません(新規インストールと「初期化」のときに反映されます)。"] },
  { v:"1.19.0", lines:["初期値を整理しました。保管場所は、持ち歩き=「いつものバッグ」「ポーチ」、持ち出し=「リュック」「職場置き」。ワンタップ追加の候補は、持ち歩き=「サブバッグ」「通学バッグ」「通勤バッグ」、持ち出し=「非常持ち出し袋」「玄関」「車」です。","アプリのヒント文と、持ち歩き・持ち出し・備蓄の初期のヒント文を、新しい文言にしました。編集していなければ、自動で新しい文に置き換わります(自分で書き換えた文はそのままです)。","すでに登録している保管場所は変わりません。新しい初期値は、新規インストールと「初期化」のときに反映されます。"] },
  { v:"1.18.1", lines:["デザイン案の試し: タブの丸い印を数字(0・1・2)に戻しました。","「保管場所ごと」の切り替えのアイコンを、いま開いている区分のアイコン(持ち歩き=スニーカー、持ち出し=リュック、備蓄=家)に置き換えました。"] },
  { v:"1.18.0", lines:["アプリのヒント文と、持ち歩き・持ち出し・備蓄のヒント文を、右の矢印で閉じられるようにしました。閉じた状態は覚えていて、初期は開いています(備えのヒント文は3つの区分で共通です)。閉じても「保管場所を編集」は使えます。","「保管場所ごと」の画面の場所の見出しを、「用品ごと」の保管場所チップと同じ形(色つきの丸い印)にして、連動していることが分かりやすくしました。数は「あった数/用品の数」です。","ピン留め欄の区分のタグ(持ち歩き・持ち出し・備蓄)の横幅をそろえました。"] },
  { v:"1.17.1", lines:["スマホを横向きにしたときに、上の部分(タイトル・ピン留め・進捗バー・タブ・ヒント文)を低くして、用品の一覧を広く見せるようにしました。"] },
  { v:"1.17.0", lines:["パソコン・タブレット・スマホ横向きなど、広い画面で見やすくしました。画面の幅(最大1200px)に合わせて、用品の一覧と保管場所ごとの一覧、ピン留めが自動で段組みに並びます。","広い画面では、3つの区分の進捗バーを横に並べ、設定画面は読みやすい幅にしています。","段組みのあいだは、並べ替えのドラッグ(持ち手)を隠します。並べ替えは、幅の狭い縦向きの画面で行えます。"] },
  { v:"1.16.1", lines:["「用品ごと」「保管場所ごと」の切り替えに、アイコンを付けました(用品ごと=リスト、保管場所ごと=場所のマーク)。"] },
  { v:"1.16.0", lines:["タブの丸い印を、数字(0・1・2)から、持ち歩き=スニーカー、持ち出し=リュック、備蓄=家のアイコンに変えました(絵文字ではなく、アプリの線のデザインに合わせた絵です)。"] },
  { v:"1.15.3", lines:["✎(編集)を押したとき、品名の入力欄と保管場所チップが重なって見えて編集しづらかった表示を直しました(入力欄の下に余白を入れ、入力中の枠も内側に収めました)。"] },
  { v:"1.15.2", lines:["スワイプで操作できるタッチ端末では、用品ごとの行の📌(ピン留め)と👁(非表示)のアイコンを出さないようにしました。ピン留めは右スワイプ、非表示は左スワイプです。並べ替えのハンドルと✎(編集)だけを、右上に小さくまとめて、品名の幅を広げました。パソコンなど、マウスの端末では今までどおりアイコンも表示します。"] },
  { v:"1.15.1", lines:["「保管場所ごと」のチェックを、四角ではなく丸い印に変えました(用品ごとの四角いチェックと見分けやすくするためです)。"] },
  { v:"1.15.0", lines:["「保管場所ごと」のチェックを、用品ごとのチェックではなく「その保管場所にあるか」のチェックに変えました。同じ用品でも、保管場所ごとに別々にチェックでき、チェックすると「用品ごと」の保管場所チップが点灯します。保管場所ごとの見出しは(あった数/用品の数)で表示します。","全データの初期化、「前に戻す」を実行したあとに、完了メッセージを出すようにしました(CSV・JSONの取り込みは、もともと完了メッセージが出ます)。"] },
  { v:"1.14.0", lines:["用品の初期リストを、公的資料(消防庁の持出品・備蓄品チェックシート、東京都の防災アクション、農林水産省の家庭備蓄の解説)をもとに見直しました。数量が資料にあるものは品名に入れています(例:飲料水は1人1日3L、カセットボンベは1人1週間で約6本、簡易トイレは1人1日5回分)。","用品に「食品・生活・その他」の分類を追加しました。設定の「防災用品マスタ」で、区分ごとに分類のアコーディオンで見られます。分類は ✎ の編集で変えられます。用品一覧の画面は変わりません。","CSVの書き出しに「分類」の列を追加しました(旧形式のCSVもそのまま取り込めます)。","すでにある用品は、品名から分類を自動で推測して設定します。リストの中身は変えません。"] },
  { v:"1.13.2", lines:["持ち出しの保管場所に、ワンタップで足せる候補「職場に保管」を追加しました。"] },
  { v:"1.13.1", lines:["保管場所の初期値を、1人暮らし・子どもなし・仕事や学校の有無を問わない名前に整理しました(持ち歩き:いつものバッグ・防災ポーチ/持ち出し:防災リュック・玄関/備蓄:リビング・寝室・押し入れ)。","ワンタップで足せる候補も見直しました。すでに登録済みの保管場所は変わりません(新しくインストールしたときと、設定の「初期化」をしたときに反映されます)。"] },
  { v:"1.13.0", lines:["絞り込みバーの右端に、小さな検索窓を追加しました。品名・保管場所の一部を入力すると、その場で絞り込めます(ひらがな・カタカナの違いは区別しません。空白で区切ると、すべてを含むものだけ)。","チップ名を「全」「未チェック」に、「非表示も表示」を「非表示」に変更しました。"] },
  { v:"1.12.7", lines:["「0次・1次・2次の備え」の呼び方を「持ち歩き・持ち出し・備蓄」に変更しました(タブ・進捗バー・ピン留めのタグ・初期の説明文など)。丸いスタンプは0・1・2のままです。","CSVの1列目の見出しは「区分」になりました。以前の「0次の備え」などの書き方のCSVも、そのまま取り込めます。","編集していない初期の説明文とアプリのヒント文は、自動で新しい文に置き換わります。"] },
  { v:"1.12.6", lines:["ヒント文(アプリのヒントと各次の備えのヒント)の文字サイズ・行間を元に戻しました。上下の余白は詰めたままです。"] },
  { v:"1.12.5", lines:["タブの丸いスタンプを、元のサイズ(32px)に戻しました。"] },
  { v:"1.12.4", lines:["上部をコンパクトにしました(タイトル周り・進捗バー・タブ・備えのヒント文の余白と文字を小さく)。用品リストをより多く表示できます。"] },
  { v:"1.12.3", lines:["保管場所のチップをコンパクトにしました(高さ36→26px、文字12px)。タップできる範囲は見た目より広く確保しています。"] },
  { v:"1.12.2", lines:["ピン留め欄を、バンドマン持ち物リストのようなコンパクトなサイズ感にしました(高さ・文字・余白を小さくしました)。"] },
  { v:"1.12.1", lines:["ピン留め欄の表示が崩れていた不具合を直しました(1.12.0 で見た目の設定が抜けていました)。","取り込み確認の4行表示の見た目も、あわせて戻しました。"] },

      var paper = { id:newId(), name:"紙類(防水袋とセット)", checked:false, locations:[] };
      if(ci === -1) g1.push(paper); else g1.splice(ci + 1, 0, paper);
    }
    if(st.groups.g1.desc === OLD_DEFAULT_DESC_G1) st.groups.g1.desc = DEFAULT_DESC.g1;
    var g0 = st.groups.g0.items;
    ["非常食","絆創膏","アルコール消毒"].forEach(function(n){
      if(!g0.some(function(it){ return it.name === n; })) g0.push({ id:newId(), name:n, checked:false, locations:[] });
    });
  }
  if(v < 3){
    // 0次の保管場所「持ち歩き用」→「持ち歩き1」+「持ち歩き2」

    if(idx !== -1){

      if(has1){ grp.locations.splice(idx, 1); } else { grp.locations[idx] = "持ち歩き1"; }
      grp.items.forEach(function(it){
        var out = [];
        it.locations.forEach(function(l){ var n = keyOf(l) === keyOf("持ち歩き用") ? "持ち歩き1" : l; if(out.indexOf(n) === -1) out.push(n); });
        it.locations = out; it.have = out.filter(function(l){ return (it.have || []).indexOf(l) !== -1 || ((it.have || []).indexOf("持ち歩き用") !== -1 && l === "持ち歩き1"); });
      });

  if(v < 8){

    GROUP_ORDER.forEach(function(g){ st.groups[g].items.forEach(function(it){ if(!catKey(it.cat)) it.cat = guessCat(it.name); }); });
  }
  if(v < 9){

    GROUP_ORDER.forEach(function(g){ if(st.groups[g].desc === V8_DEFAULT_DESC[g]) st.groups[g].desc = DEFAULT_DESC[g]; });

    GROUP_ORDER.forEach(function(g){

      grp.locations = fix(grp.locations);

var state = null;
var prevSnap = null;       // {label, at, text} — state just before the last import / reset
var saveFailed = false;

function lsGet(k){ try{ return window.localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k, v){ try{ window.localStorage.setItem(k, v); return true; }catch(e){ return false; } }
function lsDel(k){ try{ window.localStorage.removeItem(k); }catch(e){} }

function storageGet(){
  try{
    var raw = window.localStorage.getItem(STORAGE_KEY);
    return Promise.resolve(raw ? { value:raw } : null);
  }catch(e){
    try{
      if(window.storage && window.storage.get){ return window.storage.get(STORAGE_KEY, false).catch(function(){ return null; }); }
    }catch(e2){}
    return Promise.resolve(null);
  }
}
function storageSet(text){
  var ok = false;
  try{ window.localStorage.setItem(STORAGE_KEY, text); ok = true; }
  catch(e){
    try{
      if(window.storage && window.storage.set){ window.storage.set(STORAGE_KEY, text, false).catch(function(){}); ok = true; }
    }catch(e2){}
  }
  var was = saveFailed;
  saveFailed = !ok;
  if(was !== saveFailed && state) render();
}
function save(){ storageSet(JSON.stringify(state)); }

function rememberPrev(label){
  prevSnap = { label:label, at:Date.now(), text:JSON.stringify(state) };
  lsSet(PREV_KEY, JSON.stringify(prevSnap));
}
function prevBefore(){  // 戻したときの「何の前か」を短く表す
  var l = prevSnap ? prevSnap.label : "";

  if(l.indexOf("CSV") === 0) return "CSVの取り込み";

}
function loadPrev(){

}
function replaceState(next, label){
  rememberPrev(label);
  state = next;
  openSwipeId = null; editingItemId = null; pendingDeleteId = null; pendingDeleteLoc = null;
  save();
}

var updateNotes = null;      // 表示する更新内容(閉じたら null)
var swUpdated = false;       // 新しい版を取得済み → 再読み込みをすすめる
var newVersion = "";         // 見つかった新しい版の番号
var updateMsg = null;        // 設定の「更新を確認」の結果表示
var lastUpdateCheck = 0, updateChecking = false;
var UPDATE_CHECK_MS = 5 * 60 * 1000;   // 開いている間、これくらいの間隔で最新版を確認する
/* サーバーの index.html から最新の版番号を読み、いまの版より新しければ「再読み込み」のお知らせを出す */
function checkForUpdate(manual){
  if(updateChecking) return Promise.resolve();
  updateChecking = true; lastUpdateCheck = Date.now();
  if(manual){ updateMsg = { type:"", text:"確認中…" }; render(); }
  try{ if(navigator.serviceWorker && navigator.serviceWorker.getRegistration){ navigator.serviceWorker.getRegistration().then(function(r){ if(r) r.update().catch(function(){}); }).catch(function(){}); } }catch(e){}
  return fetch("index.html?_=" + Date.now(), { cache:"no-store" }).then(function(r){
    if(!r.ok) throw new Error("http " + r.status);
    return r.text();
  }).then(function(t){
    var m = /var APP_VERSION = "(\d+\.\d+\.\d+)"/.exec(t);
    if(!m) throw new Error("no version");
    if(cmpVer(m[1], APP_VERSION) > 0){
      newVersion = m[1]; swUpdated = true;
      if(manual) updateMsg = { type:"ok", text:"新しいバージョン " + m[1] + " があります。上の「再読み込み」で更新できます。" };
    } else if(manual){
      updateMsg = { type:"ok", text:"最新です(" + APP_VERSION + ")。" };
    }
  }).catch(function(){
    if(manual) updateMsg = { type:"error", text:"確認できませんでした。オフラインか、通信が不安定かもしれません。" };
  }).then(function(){ updateChecking = false; if(state && (manual || swUpdated)) render(); });
}
function prepareUpdateNotice(hadData){
  var last = lsGet(SEEN_KEY);
  if(!last){ if(hadData) last = "1.0.0"; else { lsSet(SEEN_KEY, APP_VERSION); return; } }
  if(cmpVer(last, APP_VERSION) >= 0) return;
  var shown = RELEASE_NOTES.filter(function(n){ return cmpVer(n.v, last) > 0 && cmpVer(n.v, APP_VERSION) <= 0; }).slice(0, 3);
  if(shown.length) updateNotes = shown; else lsSet(SEEN_KEY, APP_VERSION);
}

  if(updateNotes){

    updateNotes.forEach(function(n){ n.lines.forEach(function(l){ h += '<div>・' + esc(l) + '</div>'; }); });
    h += '</div><button type="button" class="notice-x" data-act="dismiss-update" aria-label="お知らせを閉じる">' + ICON_X + '</button></div>';

function load(){
  return storageGet().then(function(res){
    var loaded = null;
    if(res && res.value){
      try{ loaded = sanitizeState(JSON.parse(res.value)); }catch(e){ loaded = null; }
      if(!loaded) lsSet(BROKEN_KEY, res.value);          // keep unreadable data instead of silently overwriting it
    }
    state = loaded || defaultData();
    migrate(state);
    prepareUpdateNotice(!!(res && res.value));
    loadPrev();
    render();
    save();
    checkIncomingPack();
  });
}

/* ================= CSV: parse / build ================= */
function csvCell(v){
  var s = String(v == null ? "" : v);
  if(/^[=+\-@\t\r]/.test(s)) s = "'" + s;  // Excel等で数式として実行されないよう、先頭に ' を付ける(取り込み時に外す)
  if(/[",\r\n]/.test(s) || /^\s|\s$/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
  return s;
}
/* columns: 区分, 品名, チェック(済/未), 保管場所(;区切り・置く場所), 分類(食品/生活/その他), そろった場所(;区切り・保管場所の一部). A row with an empty 品名 registers a location only. */
function buildCsvText(){
  var rows = [["区分","品名","チェック","保管場所","分類","そろった場所"]];
  GROUP_ORDER.forEach(function(g){
    var grp = state.groups[g], label = GROUP_META[g].label;
    grp.locations.forEach(function(loc){ rows.push([label, "", "", loc, "", ""]); });   // locations first: keeps their order
    grp.items.forEach(function(it){ rows.push([label, it.name, it.checked ? "済" : "未", it.locations.join(";"), catLabel(it.cat), (it.have || []).join(";")]); });
  });
  return rows.map(function(r){ return r.map(csvCell).join(","); }).join("\r\n") + "\r\n";
}

function parseCsvRows(text){
  text = String(text).replace(/^\uFEFF/, "");
  var firstLine = text.split(/\r\n|\n|\r/)[0] || "";
  var delim = ",";
  if(firstLine.indexOf(",") === -1){
    if(firstLine.indexOf("\t") !== -1) delim = "\t";
    else if(firstLine.indexOf(";") !== -1 && /^[^;]*;[^;]*;/.test(firstLine) && !/[0-9]次/.test(firstLine.split(";")[0] + "")) delim = ";";
  }
  var rows = [], row = [], field = "", inQ = false, i, c;
  for(i = 0; i < text.length; i++){
    c = text.charAt(i);
    if(inQ){
      if(c === '"'){ if(text.charAt(i + 1) === '"'){ field += '"'; i++; } else { inQ = false; } }
      else { field += c; }
    } else if(c === '"' && field === ""){ inQ = true; }
    else if(c === delim){ row.push(field); field = ""; }
    else if(c === "\r" || c === "\n"){
      if(c === "\r" && text.charAt(i + 1) === "\n") i++;
      row.push(field); rows.push(row); row = []; field = "";
    } else { field += c; }
  }
  if(field !== "" || row.length){ row.push(field); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(cell){ return String(cell).trim() !== ""; }); });
}

function parseGroupKey(cell){
  var m = keyOf(cell == null ? "" : cell).match(/^(?:g([012])|([012])\s*次.*|(持ち歩き).*|(持ち出し).*|(備蓄).*)$/);
  if(!m) return null;
  if(m[3]) return "g0";
  if(m[4]) return "g1";
  if(m[5]) return "g2";
  return "g" + (m[1] || m[2]);
}
var TRUE_WORDS = ["済","済み","○","◯","〇","✓","✔","☑","1","true","yes","y","x","はい","完了","チェック済"];
var FALSE_WORDS = ["","未","未済","未完了","×","✕","☐","0","false","no","n","いいえ","-","ー"];
function parseCheckedCell(cell){
  var k = keyOf(cell == null ? "" : cell);
  if(TRUE_WORDS.indexOf(k) !== -1) return true;
  if(FALSE_WORDS.indexOf(k) !== -1) return false;
  return null;   // unknown word
}
function splitLocations(cell){
  var seen = dict(), out = [];
  String(cell == null ? "" : cell).split(/[;；、|]/).forEach(function(p){
    var t = cleanLine(p, MAX_LOC_NAME), k = keyOf(t);
    if(t && !seen[k]){ seen[k] = true; out.push(t); }
  });
  return out;
}

var HEADER_WORDS = {
  group:["区分","次","次数","避難","次避難","備え","次の備え","group"],
  name:["アイテム名","アイテム","品名","名前","name","item"],
  check:["チェック","チェック状態","状態","準備","check","done"],

  if(u8.length >= 2 && u8[0] === 0xFE && u8[1] === 0xFF) return { text:new TextDecoder("utf-16be").decode(u8.subarray(2)), enc:"UTF-16" };
  try{ return { text:new TextDecoder("utf-8", { fatal:true }).decode(u8), enc:"UTF-8" }; }catch(e){}

    }catch(e2){}

}

function planCsvImport(text, mode, cur){

function buildPackPreviewHtml(plan){
  var h = '';
  plan.fatal.forEach(function(f){ h += '<div class="msg error" role="alert">' + esc(f) + '</div>'; });
  if(!plan.ok) return h;
  plan.warnings.forEach(function(w){ h += '<div class="msg warn" role="status">' + esc(w) + '</div>'; });
  h += '<div class="preview"><h3>取り込みの確認</h3><div class="pv-group"><div class="pv-head">' + esc(plan.title) + '<small>' + plan.items.length + '件</small></div>'
    + '<p class="field-title" style="margin:8px 0">追加先の区分</p>' + packSegHtml("pack-imp-g", packImp.g)
    + plan.items.map(function(d){ return '<p class="pv-line"><span class="tag add">用品</span>' + esc(d.name) + ' <small>(' + esc(catLabel(d.cat)) + ')</small></p>'; }).join('')
    + '</div></div>'
    + '<div class="btn-row"><button type="button" class="btn" data-act="pack-imp-save">自分のパックに保存</button><button type="button" class="btn btn-ghost" data-act="pack-imp-cancel">やめる</button></div>';
  return h;
}

function buildMarkdownText(){
  function one(v){ return String(v).replace(/[\r\n]+/g, " ").trim(); }
  var d = new Date();
  var out = ["# わが家の防災リスト", "", d.getFullYear() + "/" + pad2(d.getMonth() + 1) + "/" + pad2(d.getDate()) + " 時点", ""];
  GROUP_ORDER.forEach(function(g){
    var grp = state.groups[g], items = grp.items.filter(function(it){ return !it.hidden; });
    var done = items.filter(function(it){ return it.checked; }).length;
    out.push("## " + GROUP_META[g].label + "(" + done + "/" + items.length + ")", "");
    if(grp.desc) out.push(one(grp.desc), "");
    if(grp.locations.length) out.push("保管場所: " + grp.locations.map(one).join("、"), "");
    items.forEach(function(it){
      var locs = it.locations.length ? "(" + it.locations.map(one).join("・") + ")" : "";
      out.push("- [" + (it.checked ? "x" : " ") + "] " + one(it.name) + locs);
    });

  });
  return out.join("\n").replace(/\n+$/, "\n");
}

  if(file.size > MAX_FILE_BYTES){ target.msg = { type:"error", text:"ファイルが大きすぎます(上限 3MB)。" }; render(); return; }
  var reader = new FileReader();
  reader.onload = function(){

    target.text = dec.text; target.enc = dec.enc; target.garbled = !!dec.garbled; target.file = file.name; target.msg = null;

  reader.readAsArrayBuffer(file);
}

  "restore-locs": function(t){
    var g = getGroup(t), grp = state.groups[g], defs = DEFAULT_LOCATIONS[g], before = grp.locations.length, added = [];
    var allBefore = grp.items.filter(function(it){ return before && it.locations.length === before; });   // すべての場所に置く設定の用品
    defs.forEach(function(name, di){
      if(findLoc(grp.locations, name) !== -1 || grp.locations.length >= MAX_LOCATIONS) return;
      var at = 0;   // 初期の並びで、すぐ前にある場所の後ろに入れる(なければ先頭)
      for(var k = di - 1; k >= 0; k--){ var pi = findLoc(grp.locations, defs[k]); if(pi !== -1){ at = pi + 1; break; } }
      grp.locations.splice(at, 0, name); added.push(name);
      allBefore.forEach(function(it){ if(it.locations.indexOf(name) === -1) it.locations.push(name); });
    });
    delUndo = null; renameLoc = null;
    locMsg = added.length ? "戻しました: " + added.join("・") + "(自分で作った保管場所は、そのまま残っています)" : ""; locMsgOk = true;
    render(); save();
  },

  "undo-del": function(){

    if(u.kind === "loc"){
      if(findLoc(grp.locations, u.name) === -1 && grp.locations.length < MAX_LOCATIONS){
        grp.locations.splice(Math.min(u.index, grp.locations.length), 0, u.name);
        u.items.forEach(function(sn){
          var it = findItem(u.g, sn.id); if(!it) return;
          if(it.locations.indexOf(u.name) === -1) it.locations.splice(Math.min(sn.li, it.locations.length), 0, u.name);

          if(sn.have && it.have.indexOf(u.name) === -1) it.have.push(u.name);

        });

    } else {
      var list = getSug(u.g).slice();

  var t = target.closest("[data-act]");

var ovSwipe = null;
appEl.addEventListener("pointerdown", function(e){
  if(e.pointerType === "mouse" && e.button !== 0) return;
  var ov = e.target && e.target.closest ? e.target.closest(".overview") : null;
  if(!ov) return;
  ovSwipe = { el:ov, pid:e.pointerId, x0:e.clientX, y0:e.clientY, on:false };
});
appEl.addEventListener("pointermove", function(e){
  if(!ovSwipe || e.pointerId !== ovSwipe.pid) return;
  var dx = e.clientX - ovSwipe.x0, dy = e.clientY - ovSwipe.y0;
  if(!ovSwipe.on){ if(Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)){ ovSwipe = null; return; } if(dx < -10 && Math.abs(dx) > Math.abs(dy)) ovSwipe.on = true; else return; }
  var x = Math.min(0, dx); ovSwipe.el.style.transition = "none"; ovSwipe.el.style.transform = "translateX(" + x + "px)"; ovSwipe.el.style.opacity = String(Math.max(.2, 1 + x / 260));
});
function endOvSwipe(e, cancel){
  if(!ovSwipe || e.pointerId !== ovSwipe.pid) return;
  var s = ovSwipe, dx = e.clientX - s.x0; ovSwipe = null;
  if(!s.on) return;
  s.el.style.transition = "";
  if(!cancel && dx < -70){ lsSet(OVERVIEW_KEY, "1"); render(); }
  else { s.el.style.transform = ""; s.el.style.opacity = ""; }
}
appEl.addEventListener("pointerup", function(e){ endOvSwipe(e, false); });

/* ---- reorder (drag the grip, or ArrowUp/ArrowDown on it) ---- */
function visibleIds(g){
  return state.groups[g].items.filter(isShown).map(function(it){ return it.id; });
}
/* move the item (by id) to position `to` among the items currently shown; hidden-away items keep their slots */
function reorderVisible(g, id, to){
  var grp = state.groups[g], vis = visibleIds(g), from = vis.indexOf(id);
  if(from === -1 || to < 0 || to >= vis.length || to === from) return false;
  var slots = [];
  grp.items.forEach(function(it, i){ if(vis.indexOf(it.id) !== -1) slots.push(i); });
  var byId = {}; grp.items.forEach(function(it){ byId[it.id] = it; });
  vis.splice(to, 0, vis.splice(from, 1)[0]);
  var out = grp.items.slice();
  slots.forEach(function(pos, k){ out[pos] = byId[vis[k]]; });
  grp.items = out;
  return true;
}
var drag = null;
function dragUpdate(){
  if(!drag) return;
  var y = drag.clientY + (window.pageYOffset || 0), dy = y - drag.y0;
  var r = drag.rects, f = drag.from;
  drag.el.style.transform = "translateY(" + dy + "px)";
  var center = r[f].top + r[f].h / 2 + dy, to = f;
  for(var i = 0; i < r.length; i++){
    if(i === f) continue;
    var mid = r[i].top + r[i].h / 2;
    if(i > f && center > mid) to = Math.max(to, i);
    if(i < f && center < mid) to = Math.min(to, i);
  }
  drag.to = to;
  for(var j = 0; j < drag.els.length; j++){
    if(j === f) continue;
    var shift = 0;
    if(f < to && j > f && j <= to) shift = -r[f].h;
    if(f > to && j >= to && j < f) shift = r[f].h;
    drag.els[j].style.transform = shift ? "translateY(" + shift + "px)" : "";
  }
}
function dragLoop(){
  if(!drag) return;
  var vh = window.innerHeight || 600, step = 0;
  if(drag.clientY < 70) step = -14; else if(drag.clientY > vh - 70) step = 14;
  if(step){ window.scrollBy(0, step); dragUpdate(); }
  drag.raf = window.requestAnimationFrame(dragLoop);
}
function dragCleanup(){
  if(!drag) return;
  if(drag.raf) window.cancelAnimationFrame(drag.raf);
  drag.els.forEach(function(el){ el.style.transform = ""; el.classList.remove("drag-lifted"); });
  if(drag.list) drag.list.classList.remove("dragging-list");
  drag = null;
}
appEl.addEventListener("pointerdown", function(e){
  if(e.pointerType === "mouse" && e.button !== 0) return;
  var h = e.target && e.target.closest ? e.target.closest(".drag-handle") : null;
  if(!h) return;
  var itemEl = h.closest(".item"), list = itemEl && itemEl.parentNode;
  if(!itemEl || !list) return;
  e.preventDefault();
  closeSwipe();
  var els = Array.prototype.filter.call(list.children, function(c){ return c.classList.contains("item"); });
  var from = els.indexOf(itemEl); if(from === -1) return;
  var sy = window.pageYOffset || 0;
  var rects = els.map(function(el){ var b = el.getBoundingClientRect(); return { top:b.top + sy, h:b.height }; });
  drag = { pid:e.pointerId, g:h.getAttribute("data-g"), id:h.getAttribute("data-drag-id"), el:itemEl, els:els, list:list, rects:rects, from:from, to:from, y0:e.clientY + sy, clientY:e.clientY, raf:0 };
  itemEl.classList.add("drag-lifted"); list.classList.add("dragging-list");
  try{ h.setPointerCapture(e.pointerId); }catch(err){}
  drag.raf = window.requestAnimationFrame(dragLoop);
});
appEl.addEventListener("pointermove", function(e){
  if(!drag || e.pointerId !== drag.pid) return;
  e.preventDefault();
  drag.clientY = e.clientY; dragUpdate();
});
function finishDrag(e, cancel){
  if(!drag || e.pointerId !== drag.pid) return;
  var d = drag, moved = !cancel && d.to !== d.from;
  dragCleanup();
  if(moved && GROUP_ORDER.indexOf(d.g) !== -1 && reorderVisible(d.g, d.id, d.to)){ render(); save(); }
}
appEl.addEventListener("pointerup", function(e){ finishDrag(e, false); });
appEl.addEventListener("pointercancel", function(e){ finishDrag(e, true); });
appEl.addEventListener("keydown", function(e){
  var t = e.target;
  if(!t || !t.classList || !t.classList.contains("drag-handle")) return;
  var delta = e.key === "ArrowUp" ? -1 : e.key === "ArrowDown" ? 1 : 0;
  if(!delta) return;
  e.preventDefault();
  var g = t.getAttribute("data-g"), id = t.getAttribute("data-drag-id");
  if(GROUP_ORDER.indexOf(g) === -1) return;
  var at = visibleIds(g).indexOf(id);
  if(reorderVisible(g, id, at + delta)){
    render(); save();
    var again = appEl.querySelector('.drag-handle[data-drag-id="' + id + '"]');
    if(again){ try{ again.focus(); }catch(err){} }
  }
});

/* ---- chip reorder (保管場所・候補チップ: ドラッグ、または左右キー) ---- */
var cdrag = null;
function pickAddLoc(g, name){   // 用品の鉛筆から場所を足したときは、その用品の置く場所にも入れる
  if(!pickFor) return;
  var it = findItem(g, pickFor); if(!it || it.locations.indexOf(name) !== -1) return;
  if(!Array.isArray(it.have)) it.have = [];
  var first = !it.locations.length; it.locations.push(name); it.und = false;
  if(first && it.checked) it.have.push(name);
  syncItem(it);
}
function moveIn(arr, from, to){ var x = arr.splice(from, 1)[0]; arr.splice(to, 0, x); }
function applyChipOrder(kind, g, from, to){
  if(GROUP_ORDER.indexOf(g) === -1 || from === to || to < 0) return false;
  var grp = state.groups[g];
  if(kind === "loc"){ if(from >= grp.locations.length || to >= grp.locations.length) return false; moveIn(grp.locations, from, to); return true; }
  var list = getSug(g).slice(); if(from >= list.length || to >= list.length) return false;
  moveIn(list, from, to); grp.sug = list; return true;
}
function chipDropAt(d, x, y){
  var best = -1, bd = 1e9;
  d.rects.forEach(function(r, i){ if(i === d.from) return; var dist = Math.abs(y - (r.t + r.h / 2)) * 3 + Math.abs(x - (r.l + r.w / 2)); if(dist < bd){ bd = dist; best = i; } });
  if(best === -1) return { to:d.from, idx:-1, after:false };
  var r = d.rects[best], after = x > r.l + r.w / 2, t = best + (after ? 1 : 0);
  if(t > d.from) t--;
  return { to:t, idx:best, after:after };
}
function chipDragCleanup(){
  if(!cdrag) return;
  cdrag.els.forEach(function(el){ el.style.transform = ""; el.classList.remove("chip-lift", "drop-b", "drop-a"); });
  cdrag = null;
}
appEl.addEventListener("keydown", function(e){   // キーボード: 用品名で Enter / F2 → 編集
  var t = e.target;
  if(t && t.hasAttribute && t.hasAttribute("data-dt") && (e.key === "Enter" || e.key === "F2")){ e.preventDefault(); ACTIONS["start-edit"](t); }
});
appEl.addEventListener("pointerdown", function(e){
  if(e.pointerType === "mouse" && e.button !== 0) return;
  var h = e.target && e.target.closest ? e.target.closest(".chip-grip") : null; if(!h) return;
  var chip = h.parentNode, box = chip && chip.parentNode; if(!box) return;
  e.preventDefault();
  var els = Array.prototype.filter.call(box.children, function(c){ return c.hasAttribute("data-ci"); });
  var from = els.indexOf(chip); if(from === -1) return;
  var sx = window.pageXOffset || 0, sy = window.pageYOffset || 0;
  var rects = els.map(function(el){ var b = el.getBoundingClientRect(); return { l:b.left + sx, t:b.top + sy, w:b.width, h:b.height }; });
  cdrag = { pid:e.pointerId, kind:h.getAttribute("data-grip"), g:h.getAttribute("data-g"), el:chip, els:els, rects:rects, from:from, to:from, x0:e.clientX + sx, y0:e.clientY + sy };
  chip.classList.add("chip-lift");
  try{ h.setPointerCapture(e.pointerId); }catch(err){}
});
appEl.addEventListener("pointermove", function(e){
  if(!cdrag || e.pointerId !== cdrag.pid) return;
  e.preventDefault();
  var sx = window.pageXOffset || 0, sy = window.pageYOffset || 0, x = e.clientX + sx, y = e.clientY + sy;
  cdrag.el.style.transform = "translate(" + (x - cdrag.x0) + "px," + (y - cdrag.y0) + "px)";
  var r = chipDropAt(cdrag, x, y); cdrag.to = r.to;
  cdrag.els.forEach(function(el){ el.classList.remove("drop-b", "drop-a"); });
  if(r.idx !== -1 && r.to !== cdrag.from) cdrag.els[r.idx].classList.add(r.after ? "drop-a" : "drop-b");
});
function finishChipDrag(e, cancel){
  if(!cdrag || e.pointerId !== cdrag.pid) return;
  var d = cdrag; chipDragCleanup();
  if(!cancel && applyChipOrder(d.kind, d.g, d.from, d.to)){ render(); save(); }
}
appEl.addEventListener("pointerup", function(e){ finishChipDrag(e, false); });
appEl.addEventListener("pointercancel", function(e){ finishChipDrag(e, true); });
appEl.addEventListener("keydown", function(e){
  var t = e.target; if(!t || !t.classList || !t.classList.contains("chip-grip")) return;
  var delta = (e.key === "ArrowLeft" || e.key === "ArrowUp") ? -1 : (e.key === "ArrowRight" || e.key === "ArrowDown") ? 1 : 0;
  if(!delta) return; e.preventDefault();
  var kind = t.getAttribute("data-grip"), g = t.getAttribute("data-g"), i = parseInt(t.getAttribute("data-i"), 10);
  if(applyChipOrder(kind, g, i, i + delta)){
    render(); save();
    var again = appEl.querySelector('.chip-grip[data-grip="' + kind + '"][data-g="' + g + '"][data-i="' + (i + delta) + '"]');
    if(again){ try{ again.focus(); }catch(err){} }
  }
});

/* ---- swipe to delete ---- */
var swipe = null, suppressClickUntil = 0;
function swipeEls(id){
  var list = appEl.querySelectorAll(".swipe-content");
  for(var i = 0; i < list.length; i++){
    if(list[i].getAttribute("data-swipe-id") === id){
      var wrap = list[i].parentNode;
      return { content:list[i], btn:wrap.querySelector(".swipe-del"), pinBtn:wrap.querySelector(".swipe-pin") };
    }
  }
  return null;
}
function setSwipeOpen(id, open, side){
  var els = swipeEls(id);
  if(!els) return;
  side = side || "r";
  els.content.classList.remove("dragging");
  els.content.style.transform = "";
  els.content.classList.toggle("open", !!open && side === "r");
  els.content.classList.toggle("open-l", !!open && side === "l");
  if(els.btn){ els.btn.setAttribute("tabindex", open && side === "r" ? "0" : "-1"); els.btn.setAttribute("aria-hidden", open && side === "r" ? "false" : "true"); }
  if(els.pinBtn){ els.pinBtn.setAttribute("tabindex", open && side === "l" ? "0" : "-1"); els.pinBtn.setAttribute("aria-hidden", open && side === "l" ? "false" : "true"); }
}
function closeSwipe(){
  if(!openSwipeId) return;
  var id = openSwipeId; openSwipeId = null;
  setSwipeOpen(id, false);
}
function swipeOffset(sw, x){ return Math.max(sw.noLeft ? 0 : -OPEN_W - 24, Math.min(sw.pin ? OPEN_W + 24 : 0, sw.base + (x - sw.x0))); }

appEl.addEventListener("pointerdown", function(e){
  if(e.pointerType === "mouse" && e.button !== 0) return;
  var target = e.target;
  if(!target || !target.closest) return;
  var content = target.closest(".swipe-content");
  var onDel = !!target.closest(".swipe-del, .swipe-pin");
  if(openSwipeId && !onDel && (!content || content.getAttribute("data-swipe-id") !== openSwipeId)) closeSwipe();
  if(!content || onDel || content.getAttribute("data-noswipe") || target.closest("input,textarea,.drag-handle")) return;
  var id = content.getAttribute("data-swipe-id");
  swipe = { id:id, el:content, pid:e.pointerId, x0:e.clientX, y0:e.clientY, pin:!!content.getAttribute("data-pin"), noLeft:!!content.getAttribute("data-noleft"), base:(openSwipeId === id ? (openSwipeSide === "l" ? OPEN_W : -OPEN_W) : 0), dragging:false, off:0 };
});
appEl.addEventListener("pointermove", function(e){
  if(!swipe || e.pointerId !== swipe.pid) return;
  var dx = e.clientX - swipe.x0, dy = e.clientY - swipe.y0;
  if(!swipe.dragging){
    if(Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)){ swipe = null; return; }       // vertical scroll wins
    if(Math.abs(dx) <= 8 || Math.abs(dx) <= Math.abs(dy)) return;
    swipe.dragging = true;
    try{ swipe.el.setPointerCapture(e.pointerId); }catch(err){}
    swipe.el.classList.add("dragging");
  }
  swipe.off = swipeOffset(swipe, e.clientX);
  swipe.el.style.transform = "translateX(" + swipe.off + "px)";
});
function finishSwipe(e){
  if(!swipe || e.pointerId !== swipe.pid) return;
  var sw = swipe; swipe = null;
  if(!sw.dragging) return;
  suppressClickUntil = Date.now() + 400;   // マウスでドラッグした直後の「クリック」で閉じ直さない
  try{ sw.el.releasePointerCapture(e.pointerId); }catch(err){}
  var side = !sw.noLeft && sw.off < -OPEN_W * 0.45 ? "r" : (sw.pin && sw.off > OPEN_W * 0.45 ? "l" : null);
  if(side){
    if(openSwipeId && openSwipeId !== sw.id) closeSwipe();
    openSwipeId = sw.id; openSwipeSide = side; setSwipeOpen(sw.id, true, side);
  } else {
    if(openSwipeId === sw.id) openSwipeId = null;
    setSwipeOpen(sw.id, false);
  }
}
appEl.addEventListener("pointerup", finishSwipe);
appEl.addEventListener("pointercancel", finishSwipe);
