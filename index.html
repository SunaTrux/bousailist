<!DOCTYPE html>
<html lang="ja">
<head>

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" id="meta-theme-color" content="#FAF6EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>わが家の防災リスト</title>
<script>
/* Apply a manually chosen theme before first paint (avoids a light/dark flash). */
try{var __t=localStorage.getItem("bousai-theme-pref");if(__t==="light"||__t==="dark"){document.documentElement.setAttribute("data-theme",__t);}}catch(e){}
</script>
<style>
  /* ---------- Theme tokens ----------
     color-scheme is declared (meta + CSS) so browsers with their own "auto dark" / "force dark"
     (Brave, Chrome, Samsung Internet...) leave the page alone and native controls match the theme. */
  :root{
    color-scheme: light dark;
    --paper:#FAF6EE; --card:#F2EDE0; --ink:#22303C; --ink-soft:#56666F; --line:#D6CDB9;
    --clay:#B5563C; --clay-soft:#EFDCD4;
    --amber:#9C6710; --amber-soft:#F1E3C7;
    --teal:#3A6F5F; --teal-soft:#DCE7DF;
    --on-accent:#FFFFFF;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1B2227; --card:#222B31; --ink:#EDE7DA; --ink-soft:#9AA9B1; --line:#39454C;
      --clay:#E08A6E; --clay-soft:#3C2B27;
      --amber:#E3AE5C; --amber-soft:#3B3123;
      --teal:#6BAE98; --teal-soft:#223330;
      --on-accent:#14191D;
    }
  }
  :root[data-theme="light"]{ color-scheme: light; }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --paper:#1B2227; --card:#222B31; --ink:#EDE7DA; --ink-soft:#9AA9B1; --line:#39454C;
    --clay:#E08A6E; --clay-soft:#3C2B27;
    --amber:#E3AE5C; --amber-soft:#3B3123;
    --teal:#6BAE98; --teal-soft:#223330;
    --on-accent:#14191D;
  }

  /* ---------- Base ---------- */
  *,*::before,*::after{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; background:var(--paper); }
  body{
    margin:0; padding:0; background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Yu Gothic",Meiryo,"Segoe UI",Roboto,sans-serif;
    line-height:1.5; overflow-x:hidden; -webkit-font-smoothing:antialiased;
  }
  #app{
    width:100%; max-width:480px; margin:0 auto; background:var(--paper);
    min-height:100vh; min-height:100dvh; padding-bottom:48px; overflow-x:hidden;
  }
  button{
    -webkit-appearance:none; appearance:none; background:none; border:0; padding:0; margin:0;
    font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; text-align:inherit;
    -webkit-tap-highlight-color:transparent;
  }
  button:active{ opacity:.7; }
  button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
  /* 16px keeps iOS Safari from zooming the page when a field is focused (a cause of "cut off on the right") */
  input[type="text"],textarea{
    -webkit-appearance:none; appearance:none; border-radius:0; font:inherit; font-size:16px; color:var(--ink);
    background:var(--paper); border:1px solid var(--line); padding:10px 12px; min-width:0; max-width:100%;
  }
  textarea{ width:100%; display:block; }
  input[type="file"]{ max-width:100%; font-size:14px; color:var(--ink-soft); }

  /* ---------- Header / overview ---------- */
  .header{ padding:16px 20px 10px; border-bottom:1px solid var(--line); }
  .header-top{ display:flex; align-items:center; gap:12px; }
  .header h1{ flex:1; min-width:0; font-size:22px; font-weight:900; margin:0; letter-spacing:.02em; overflow-wrap:anywhere; }
  .header p{ margin:4px 0 0; font-size:13px; color:var(--ink-soft); }
  .gear-btn{
    flex-shrink:0; display:flex; align-items:center; gap:6px; min-height:44px; padding:0 14px;
    border:1px solid var(--line); background:var(--card); border-radius:22px; font-size:13px; font-weight:700;
  }
  .notice{ display:flex; align-items:flex-start; gap:8px; padding:10px 8px 10px 20px; font-size:14px; line-height:1.6; background:var(--card); border-bottom:1px solid var(--line); }
  .notice-body{ flex:1 1 auto; min-width:0; overflow-wrap:anywhere; }
  .notice .btn{ flex-shrink:0; }
  .notice-x{ flex-shrink:0; width:44px; height:44px; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); }
  .banner{ margin:0; padding:10px 20px; font-size:13px; background:var(--clay-soft); border-bottom:1px solid var(--clay); }

  .overview{ padding:8px 20px 8px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:5px; }
  .ov-row{ display:flex; align-items:center; gap:10px; line-height:1.2; }
  .ov-label{ font-size:12px; font-weight:700; width:60px; flex-shrink:0; }
  .ov-track{ flex:1; min-width:0; height:6px; background:var(--card); border:1px solid var(--line); overflow:hidden; }
  .ov-fill{ height:100%; transition:width .3s ease; }
  .ov-count{ font-size:11px; color:var(--ink-soft); width:44px; text-align:right; flex-shrink:0; font-variant-numeric:tabular-nums; }
  .edit-ctl{ align-self:flex-start; max-width:100%; }
  .edit-open, .edit-close{ min-height:48px; padding-left:18px; padding-right:18px; }
  .link-btn{
    align-self:flex-start; min-height:44px; padding:0; font-size:13px; color:var(--ink-soft);
    text-decoration:underline; text-underline-offset:3px; overflow-wrap:anywhere;
  }

  /* ---------- Shared small controls ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:0 16px;
    border:1px solid var(--ink); background:var(--ink); color:var(--paper); font-size:14px; font-weight:700; border-radius:4px;
  }
  .btn-accent{ border-color:var(--accent,var(--ink)); background:var(--accent,var(--ink)); color:var(--on-accent); }
  .btn-danger{ border-color:var(--clay); background:var(--clay); color:var(--on-accent); }
  .btn-ghost{ border-color:var(--line); background:var(--paper); color:var(--ink); }
  .btn[disabled]{ opacity:.45; pointer-events:none; }
  .btn-row{ display:flex; flex-wrap:wrap; gap:8px; margin:0 0 10px; }
  .btn-row .btn{ flex:1 1 140px; }
  .icon-btn{
    flex-shrink:0; width:44px; height:44px; display:flex; align-items:center; justify-content:center;
    border-radius:10px; color:var(--ink-soft);
  }
  .icon-btn svg{ display:block; }

  /* ---------- Per-group editor ---------- */
  .loc-settings{ padding:16px 20px; border-bottom:1px solid var(--line); background:var(--card); }
  .field-title{ font-size:12px; font-weight:700; color:var(--ink-soft); margin:0 0 8px; }
  .desc-textarea{ min-height:84px; line-height:1.5; resize:vertical; margin-bottom:16px; }
  .loc-chips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .loc-chip{
    display:flex; align-items:center; gap:4px; max-width:100%; min-height:44px; padding:0 4px 0 12px;
    border:1px solid var(--line); background:var(--paper); border-radius:6px; font-size:14px;
  }
  .loc-chip > span{ min-width:0; overflow-wrap:anywhere; }
  .loc-chip .chip-x{ width:40px; height:40px; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); }
  .loc-chip.pending{ padding:6px 8px 6px 12px; flex-wrap:wrap; }
  .suggest-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .suggest{ min-height:44px; padding:0 14px; border:1px dashed var(--ink-soft); border-radius:22px; background:transparent; color:var(--ink); font-size:15px; max-width:100%; overflow-wrap:anywhere; }
  .suggest.on{ display:inline-flex; align-items:center; border-style:solid; border-color:var(--ink-soft); background:var(--card); color:var(--ink-soft); }
  .add-line{ display:flex; gap:8px; }
  .add-line input{ flex:1 1 auto; min-width:0; }
  .add-line .btn{ flex-shrink:0; }

  /* ---------- Tabs / description / view toggle ---------- */
  .tabs{ display:flex; border-bottom:1px solid var(--line); }
  .tab{ flex:1; min-width:0; padding:8px 4px 7px; text-align:center; position:relative; color:var(--ink-soft); }
  .tab .stamp{
    width:32px; height:32px; border-radius:50%; border:2px solid currentColor; margin:0 auto 4px;
    display:flex; align-items:center; justify-content:center; font-weight:900; font-size:14px;
  }
  .tab .stamp svg{ width:21px; height:21px; display:block; }
  .tab .tlabel{ font-size:12px; font-weight:700; }
  .tab.active{ color:var(--ink); }
  .tab.active::after{ content:''; position:absolute; left:0; right:0; bottom:-1px; height:3px; background:var(--accent,var(--ink)); }
  .tab.active .stamp{ background:var(--accent-soft,var(--card)); border-color:var(--accent,var(--ink)); }
  .group-desc{
    padding:8px 20px 6px; font-size:14px; color:var(--ink-soft); line-height:1.7; background:var(--card);
    border-bottom:1px solid var(--line); border-left:4px solid var(--accent,var(--ink)); overflow-wrap:anywhere;
  }
  .desc-link{ margin-top:0; }
  .text-link{ display:inline-block; min-height:32px; padding:6px 0 4px; background:none; color:var(--ink); font-size:14px; font-weight:700; text-decoration:underline; text-underline-offset:3px; }
  .view-toggle{ display:flex; border-bottom:1px solid var(--line); }
  .view-toggle button svg{ width:18px; height:18px; flex:none; }
  .view-toggle button{ display:flex; align-items:center; justify-content:center; gap:6px; flex:1; min-height:44px; text-align:center; background:var(--card); font-size:13px; font-weight:700; color:var(--ink-soft); }
  .view-toggle button.active{ background:var(--paper); color:var(--ink); box-shadow:inset 0 -3px 0 var(--accent,var(--ink)); }

  /* ---------- Items ---------- */
  .items{ padding:0 20px; }
  .item{ border-bottom:1px solid var(--line); }
  .swipe-wrap{ position:relative; overflow:hidden; }
  .swipe-del{
    position:absolute; top:0; right:0; bottom:0; width:88px; display:flex; align-items:center; justify-content:center;
    background:var(--clay); color:var(--on-accent); font-size:15px; font-weight:700; text-align:center;
  }
  .swipe-content{
    position:relative; background:var(--paper); padding:6px 0 12px; touch-action:pan-y; transform:translateX(0);
    transition:transform .2s ease; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  .swipe-content.dragging{ transition:none; }
  .swipe-content.open{ transform:translateX(-88px); }
  .swipe-content.open-l{ transform:translateX(88px); }
  .swipe-pin{
    position:absolute; top:0; left:0; bottom:0; width:88px; display:flex; align-items:center; justify-content:center;
    background:var(--teal); color:var(--on-accent); font-size:15px; font-weight:700; text-align:center;
  }
  .item-top{ display:flex; align-items:center; gap:2px; min-height:48px; }
  .row-btn{ width:34px; height:48px; border-radius:8px; }
  @media (max-width:360px){ .row-btn{ width:30px; } .item-top{ gap:0; } .item-top .drag-handle{ width:28px; } }
  /* スマホの横向き: 画面を広く使い、用品を2列に並べる(並べ替えのドラッグは縦1列の前提なので、横向きでは持ち手を隠す) */
  @media (orientation:landscape) and (max-height:520px) and (min-width:560px){
    #app{ max-width:none; }
    .items{ display:grid; grid-template-columns:1fr 1fr; column-gap:28px; align-items:start; }
    .loc-group{ display:grid; grid-template-columns:1fr 1fr; column-gap:28px; align-content:start; }
    .loc-group > .loc-group-title, .loc-group > .loc-head, .loc-group > .note{ grid-column:1 / -1; }
    .pin-list{ display:grid; grid-template-columns:1fr 1fr; gap:8px 28px; }
    .item-top .drag-handle{ display:none; }
  }
  /* 広い画面(パソコン・タブレット・スマホ横): 画面の幅に合わせて、用品を自動で段組みにする。
     並べ替えのドラッグは縦1列の前提なので、段組みのあいだは持ち手を隠す */
  @media (min-width:760px){
    body{ background:var(--card); }
    #app{ max-width:1200px; border-left:1px solid var(--line); border-right:1px solid var(--line); }
    #app.is-settings{ max-width:680px; }
    .header{ padding:20px 28px 12px; }
    .overview{ flex-direction:row; gap:28px; padding:12px 28px; }
    .ov-row{ flex:1 1 0; min-width:0; }
    .group-desc{ padding-left:28px; padding-right:28px; }
    .filter-bar{ padding-left:28px; padding-right:28px; }
    .filter-bar .fb-search.has-q{ max-width:240px; }
    .items{ padding:0 28px; display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); column-gap:36px; align-items:start; }
    .loc-group{ padding:0 28px 16px; display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); column-gap:36px; align-content:start; }
    .loc-group > .loc-group-title, .loc-group > .loc-head, .loc-group > .note{ grid-column:1 / -1; }
    .pins{ padding-left:28px; padding-right:28px; }
    .pin-list{ display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 400px)); gap:5px 20px; }
    .add-row{ padding-left:28px; padding-right:28px; max-width:640px; }
    .items .item-top .drag-handle{ display:none; }
  }
  /* スマホ横向きなど、高さが足りない画面: 上の部分を低くして、用品の一覧を広く見せる */
  @media (orientation:landscape) and (max-height:520px){
    .header{ padding:8px 28px 6px; }
    .header h1{ font-size:18px; }
    .header p{ margin-top:2px; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #app .header-top .settings-open, .header .btn{ min-height:36px; }
    .pins{ padding-top:6px; padding-bottom:4px; }
    .pins-hint{ display:none; }
    .overview{ padding:6px 28px; }
    .tab{ display:flex; align-items:center; justify-content:center; gap:8px; padding:5px 4px 4px; }
    .tab .stamp{ margin:0; width:26px; height:26px; }
    .tab .stamp svg{ width:17px; height:17px; }
    .group-desc{ padding-top:6px; padding-bottom:2px; font-size:12px; line-height:1.5; }
    .text-link{ min-height:30px; padding:4px 0 2px; }
    .view-toggle button{ min-height:36px; }
    .filter-bar{ padding-top:6px; padding-bottom:6px; }
  }
  /* ヒント文の開閉 */
  .fold-box{ position:relative; }
  .header .fold-box{ padding-right:34px; }
  .group-desc.fold-box{ padding-right:46px; }
  .fold-x{ position:absolute; top:-4px; right:-6px; width:40px; height:40px; display:flex; align-items:center; justify-content:center; background:none; color:var(--ink-soft); }
  .group-desc .fold-x{ top:2px; right:4px; }
  .fold-x svg{ width:18px; height:18px; transform:rotate(-90deg); }
  .fold-row{ margin-top:2px; }
  .view-fold.view-note{ padding:4px 20px 0; margin:0; }
  .loc-group > .view-fold{ grid-column:1 / -1; margin:0; padding:4px 0 0; }
  .view-note.fold-box{ padding-right:48px; }
  .view-note .fold-x{ top:4px; right:14px; }
  .loc-note.fold-box{ padding-right:34px; }
  .loc-note .fold-x{ top:-6px; right:-8px; }
  @media (min-width:760px){ .view-fold.view-note{ padding-left:28px; padding-right:28px; } .view-note .fold-x{ right:22px; } }
  .fold-btn{ display:inline-flex; align-items:center; gap:2px; min-height:32px; padding:0 8px 0 0; background:none; color:var(--ink-soft); font-size:12px; font-weight:700; }
  .fold-btn svg{ width:16px; height:16px; flex:none; }
  .group-desc.closed{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding-top:2px; padding-bottom:2px; }
  .group-desc.closed .desc-link{ margin:0; }
  .group-desc.closed .text-link{ min-height:32px; padding:0; }
  .hint-coarse{ display:none; }
  /* タッチ端末(スワイプで操作できる)では、ピン留め・非表示のアイコンは出さず、並べ替えと編集だけを右上に小さく置く */
  @media (pointer:coarse){
    .hint-fine{ display:none; }
    .hint-coarse{ display:inline; }
    .items .item-top{ align-items:flex-start; gap:0; min-height:44px; }
    .items .item-top .pin-btn, .items .item-top [data-act="toggle-hide"]{ display:none; }
    .items .item-top .row-btn{ width:30px; height:40px; }
    .items .item-top .row-btn svg{ width:19px; height:19px; }
    .items .item-top .drag-handle{ width:26px; height:40px; margin-right:0; }
  }
  .items .item-top.editing{ align-items:center; gap:2px; min-height:52px; margin-bottom:10px; }   /* 編集中は、入力欄と保管場所チップを離す */
  .item-top.editing .edit-input{ outline-offset:-2px; }
  .drag-handle{ flex-shrink:0; width:30px; height:48px; margin-left:0; margin-right:-4px; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); touch-action:none; cursor:grab; -webkit-user-select:none; user-select:none; }
  .item.drag-lifted{ position:relative; z-index:6; background:var(--paper); box-shadow:0 6px 18px rgba(0,0,0,.28); transition:none; }
  .item.drag-lifted .swipe-content{ background:var(--paper); }
  .items.dragging-list .item:not(.drag-lifted){ transition:transform .15s ease; }
  .check-btn{ flex-shrink:0; width:44px; height:44px; margin-left:-9px; display:flex; align-items:center; justify-content:center; }
  .checkbox{
    width:26px; height:26px; border:2px solid var(--ink-soft); background:var(--paper); border-radius:5px;
    display:flex; align-items:center; justify-content:center; color:var(--on-accent);
  }
  .checkbox.checked{ background:var(--accent,var(--teal)); border-color:var(--accent,var(--teal)); }
  .checkbox svg{ display:block; }
  .loc-group-item .checkbox{ border-radius:50%; }   /* 場所ごとの「そろった」は丸(用品ごとの四角いチェックと見分ける) */
  .loc-group-item.sq .checkbox{ border-radius:5px; }  /* 場所未定の行は、用品ごとと同じ四角いチェック */
  .checkbox.partial{ border-color:var(--accent,var(--ink-soft)); }
  .checkbox.partial::after{ content:""; width:12px; height:3px; border-radius:2px; background:var(--accent,var(--ink-soft)); }
  .item-name{ flex:1; min-width:0; padding:8px 4px; font-size:16px; font-weight:500; line-height:1.4; cursor:pointer; overflow-wrap:anywhere; }
  .item-name.checked{ color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--ink-soft); }
  .edit-input{ flex:1 1 auto; min-width:0; }
  .locations{ display:flex; flex-wrap:wrap; gap:6px; margin:2px 0 0 35px; }
  .loc-pill{
    position:relative; min-height:26px; padding:0 10px; border:1px solid var(--line); background:var(--paper); color:var(--ink-soft);
    border-radius:13px; font-size:12px; line-height:1.2; max-width:100%; overflow-wrap:anywhere; text-align:center;
  }
  .loc-pill::after{ content:""; position:absolute; inset:-5px -2px; } /* 見た目は小さく、タップ範囲は広く */
  .loc-pill.plan{ border:2px solid var(--accent,var(--ink)); color:var(--ink); background:transparent; font-weight:700; }
  .loc-pill.active{ background:var(--accent,var(--ink)); border-color:var(--accent,var(--ink)); color:var(--on-accent); font-weight:700; }
  .loc-settings.inline{ margin:8px 0 6px; padding:12px; border:1px solid var(--line); border-radius:6px; background:var(--card); }
  .loc-add-row{ grid-column:1 / -1; padding:14px 0 4px; }
  .loc-add-wide{ gap:6px; min-height:34px; padding:0 14px; font-size:13px; }
  .desc-text{ overflow-wrap:anywhere; }
  .desc-pencil{ display:inline-flex; align-items:center; justify-content:center; width:32px; height:28px; margin-left:2px; vertical-align:middle; background:none; color:var(--ink-soft); }
  .desc-pencil svg{ width:18px; height:18px; }
  .desc-edit-btns{ display:flex; flex-wrap:wrap; gap:8px; }
  .group-desc .desc-textarea{ margin-bottom:10px; background:var(--card); }
  .loc-add{ display:inline-flex; align-items:center; justify-content:center; min-width:34px; padding:0 8px; border-style:dashed; }
  .view-note{ margin:0; padding:12px 20px 4px; }
  @media (min-width:760px){ .view-note{ padding-left:28px; padding-right:28px; } }
  .coach{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin:8px 0 2px 35px; padding:6px 6px 6px 12px; border:1px solid var(--accent,var(--ink-soft)); border-radius:8px; background:var(--accent-soft,var(--card)); color:var(--ink); font-size:12.5px; line-height:1.5; position:relative; }

<div id="app"><noscript><p style="padding:20px">このアプリを使うにはJavaScriptを有効にしてください。</p></noscript></div>

<script>
(function(){
"use strict";

/* ================= Version =================
   Bump on every release. Keep service-worker.js CACHE_NAME in step. */
var APP_VERSION = "1.30.0";
var APP_VERSION_DATE = "2026-10-24";
var SEEN_KEY = "bousai-last-seen-version";
/* 更新のお知らせ用。新しい版を上に足す(1版あたり2〜3行) */
var RELEASE_NOTES = [
  { v:"1.30.0", lines:["表示の切り替えの行を、文字を減らしてすっきりさせました。「表示」の文字をなくし、「全｜未 6」の切り替えにまとめました。「非表示」のチェックは目のアイコン(非表示の数つき)に、検索は虫めがねのアイコンだけにして、押すと入力欄が開きます。"] },
  { v:"1.29.0", lines:["設定に「このアプリを友達に勧める」を追加しました。アプリの名前・簡単な説明・URLを、LINEやメールなどで友達に送れます(送る前に文章を確認できます。送る画面が開けない端末では、文章のコピーになります)。"] },
  { v:"1.28.1", lines:["「防災用品」タブの説明文を、「場所を決めたらタップ（枠線）→ 場所に用意できたらタップ（点灯）→ さらにタップで場所未定（消灯）」に変えました。"] },
  { v:"1.28.0", lines:["設定の「拡張パック」で、自分のパックを作れるようになりました。パック名・追加先の区分・用品(1行に1つ)を入力するか、「今のリストからパックを作る」で登録済みの用品から選んで作れます。","自分のパックは「Markdownで書き出す」でLINEやメモに貼って渡せます。もらった文章は「もらったパックを取り込む」で内容を確認してから、自分のパックとして保存できます。","自分のパックは、JSONバックアップにも含まれます。"] },
  { v:"1.27.2", lines:["チップを枠線にしたときの案内を、「以降は表示しない」にチェックするまで毎回出るようにしました(「わかった」ボタンをチェックに変えました)。止めたあとも、設定の「ガイド」から戻せます。"] },
  { v:"1.27.1", lines:["設定に「ガイド」を追加しました。「ガイドをもう一度見る」を押すと、はじめての案内(チップを枠線にしたときの吹き出し)をもう一度表示できます。"] },
  { v:"1.27.0", lines:["初めて保管場所のチップを枠線にしたときだけ、「揃えられたら、もう一度タップしよう(点灯します)」と案内を出すようにしました。「わかった」を押すか、ほかの操作をすると消えます。2回目以降は出ません。"] },
  { v:"1.26.3", lines:["「防災用品」と「どこにある？」の説明文を、右の矢印で開け閉めできるようにしました。初期は閉じていて、開閉は覚えています。","「どこにある？」の説明文を「場所ごとに揃ったらチェック。全場所に揃うと進捗バーが進みます。」に変えました。"] },
  { v:"1.26.2", lines:["「保管場所未設定」の見出しを「場所未定」に変えました。","「防災用品」タブの説明文を、「場所を決めたらタップ(枠線)→場所に揃ったらタップ(点灯)→さらにタップすると消灯し、場所未定となります。」に変えました。"] },
  { v:"1.26.1", lines:["初期の保管場所を変えました。持ち歩き=「いつものバッグ」「サブバッグ」、備蓄=「リビング」「寝室」「キッチン」。ワンタップ追加の候補は、持ち歩き=「防災ポーチ」「衛生ポーチ」「通学バッグ」「通勤バッグ」、備蓄=「押し入れ」「ベランダ」「レンタル倉庫」です(すでにある保管場所は変わりません)。","ヒント文の言い回しを短くしました。"] },
  { v:"1.26.0", lines:["用品ごとに「必要な場所すべてにそろったら準備済み」を管理できるようにしました。保管場所のチップは、タップするたびに 置く場所(枠線)→そろった(塗りつぶし)→なし と切り替わります。","「どこにある？」の場所ごとのチェック(丸)は、その場所にそろったかどうかです。すべての場所にそろうと、「防災用品」タブのチェックが自動で付き、一部だけのときは途中の印(ー)になります。「防災用品」タブのチェックを押すと、すべての場所にそろった/なしをまとめて切り替えます。","CSVに「そろった場所」の列を追加しました。この列がない古いCSVは、チェックが済のとき全部そろった扱いで取り込みます。","以前のデータは、チェック済みの用品はすべての場所にそろった扱い、未チェックの用品は置く場所のみ(まだそろっていない)になります。"] },
  { v:"1.25.0", lines:["「どこにある？」を、保管場所ごとに用品を並べて見る画面にしました。チェックはすべて四角で、「防災用品」タブのチェック(用意できたか)と同じです。どちらで付けても連動し、進捗バーにも数えられます。","各場所には、その場所のチップを点灯させた用品だけが出ます(複数の場所にある用品は、それぞれに出ます)。どこにも置いていない用品は、一番下の「保管場所未設定」に出ます。","保管場所を決めるのは、「防災用品」タブのチップです(1.15.0の「その場所にあるかのチェック」は廃止しました)。"] },
  { v:"1.24.1", lines:["「どこにある？」で、保管場所のチップがひとつも点灯していない用品は、各場所の一覧には出さず、一番下の「保管場所未設定」だけに出すようにしました。保管場所を最初に決めるのは「防災用品」タブのチップです。"] },
  { v:"1.24.0", lines:["「どこにある？」の一番下に、「保管場所未設定」の見出しを追加しました。保管場所のチップがひとつも点灯していない用品が、ここに出ます。","ここのチェックは四角で、「防災用品」タブのチェック(用意できたか)と同じものです。ほかの場所の丸いチェック(その場所にあるか)とは別です。チップを点灯させると、この見出しから消えます。"] },

  { v:"1.22.0", lines:["持ち歩き・持ち出し・備蓄のヒント文の最後に鉛筆アイコンを付けました。押すとその場で編集できます(保存・キャンセル・初期の文に戻す)。右の矢印で閉じることもできます。","保管場所の編集を、画面の上ではなく、押した「＋」チップのすぐ下に開くようにしました。「どこにあるか？」の画面では、一覧の最後の「保管場所を追加・編集」から開きます。","「保管場所を編集」のリンクと、上に出ていた編集画面はなくなりました。"] },

function cmpVer(a, b){
  var x = String(a).split("."), y = String(b).split(".");
  for(var i = 0; i < 3; i++){ var d = (parseInt(x[i], 10) || 0) - (parseInt(y[i], 10) || 0); if(d) return d < 0 ? -1 : 1; }
  return 0;
}

var BROKEN_KEY = STORAGE_KEY + "-broken";
var PREV_KEY = STORAGE_KEY + "-prev";
var THEME_KEY = "bousai-theme-pref";
var SHOWHIDDEN_KEY = "bousai-show-hidden";   // 非表示にした用品も一覧に出すか(初期は出さない)
var ONLYUNCHECKED_KEY = "bousai-only-unchecked";   // 未チェックの用品だけ表示するか(初期は全部表示)
var onlyUnchecked = (function(){ try{ return window.localStorage.getItem("bousai-only-unchecked") === "1"; }catch(e){ return false; } })();
var searchQuery = "";   // 検索窓の文字(保存しない)
var searchKey = "";     // 検索用に正規化した文字
function foldKana(s){ return s.replace(/[\u30A1-\u30F6]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0x60); }); }
function searchNorm(s){ return foldKana(String(s).normalize("NFKC").toLowerCase()); }
var keepVisible = {};   // 絞り込み中にチェックした用品は、絞り込みを切り替えるまで一覧に残す(押し間違いを直せるように)
function isShown(it){
  if(it.hidden && !showHidden) return false;
  if(onlyUnchecked && it.checked && !keepVisible[it.id]) return false;
  return matchesSearch(it);
}
function matchesSearch(it){
  if(!searchKey) return true;
  var hay = searchNorm(it.name + " " + (it.locations || []).join(" "));
  var words = searchKey.split(" ");
  for(var w = 0; w < words.length; w++){ if(words[w] && hay.indexOf(words[w]) === -1) return false; }
  return true;
}

/* Builds a clean state from untrusted input (saved data, imported JSON, CSV result).

function sanitizeState(raw){

  var usedIds = dict();

  var hint = cleanText(raw.appHint, MAX_HINT);

/* One-time content updates, tracked by contentVersion so items a user deleted never come back. */
function migrate(st){
  var v = st.contentVersion || 0;
  if(v < 2){
    var g1 = st.groups.g1.items;
    g1.forEach(function(it){ if(it.name === "着替え一式"){ it.name = "着替え一式(防水袋とセット)"; } });
    if(!g1.some(function(it){ return it.name.indexOf("紙類") === 0; })){
      var ci = -1;
      for(var i = 0; i < g1.length; i++){ if(g1[i].name.indexOf("着替え一式") === 0){ ci = i; break; } }
      var paper = { id:newId(), name:"紙類(防水袋とセット)", checked:false, locations:[] };
      if(ci === -1) g1.push(paper); else g1.splice(ci + 1, 0, paper);
    }
    if(st.groups.g1.desc === OLD_DEFAULT_DESC_G1) st.groups.g1.desc = DEFAULT_DESC.g1;
    var g0 = st.groups.g0.items;
    ["非常食","絆創膏","アルコール消毒"].forEach(function(n){
      if(!g0.some(function(it){ return it.name === n; })) g0.push({ id:newId(), name:n, checked:false, locations:[] });
    });
  }
  if(v < 3){
    // 0次の保管場所「持ち歩き用」→「持ち歩き1」+「持ち歩き2」
    var grp = st.groups.g0, idx = findLoc(grp.locations, "持ち歩き用");
    if(idx !== -1){
      var has1 = findLoc(grp.locations, "持ち歩き1") !== -1;
      if(has1){ grp.locations.splice(idx, 1); } else { grp.locations[idx] = "持ち歩き1"; }
      grp.items.forEach(function(it){
        var out = [];
        it.locations.forEach(function(l){ var n = keyOf(l) === keyOf("持ち歩き用") ? "持ち歩き1" : l; if(out.indexOf(n) === -1) out.push(n); });
        it.locations = out; it.have = out.filter(function(l){ return (it.have || []).indexOf(l) !== -1 || ((it.have || []).indexOf("持ち歩き用") !== -1 && l === "持ち歩き1"); });
      });
      if(findLoc(grp.locations, "持ち歩き2") === -1 && grp.locations.length < MAX_LOCATIONS){
        var at = findLoc(grp.locations, "持ち歩き1");
        grp.locations.splice(at === -1 ? grp.locations.length : at + 1, 0, "持ち歩き2");
      }

  }
  if(v < 4){
    // 「身分証明書のコピー」は0次→1次へ。説明文が初期値のままなら新しい文言に
    var a0 = st.groups.g0.items, a1 = st.groups.g1.items;
    var at0 = -1;
    for(var q = 0; q < a0.length; q++){ if(a0[q].name === "身分証明書のコピー"){ at0 = q; break; } }
    if(at0 !== -1){
      var moved = a0.splice(at0, 1)[0];

    }
    if(st.groups.g0.desc === OLD_DEFAULT_DESC_G0) st.groups.g0.desc = DEFAULT_DESC.g0;
  }
  if(v < 6 && v >= 5){ if(st.groups.g0.desc === PREV_DEFAULT_DESC.g0[0]) st.groups.g0.desc = DEFAULT_DESC.g0; }
  if(v < 5){
    GROUP_ORDER.forEach(function(g){
      if(PREV_DEFAULT_DESC[g].indexOf(st.groups[g].desc) !== -1) st.groups[g].desc = DEFAULT_DESC[g];
    });
  }
  if(v < 7){
    // 0次・1次・2次 → 持ち歩き・持ち出し・備蓄(初期の文のままなら新しい文に)
    GROUP_ORDER.forEach(function(g){
      var d = st.groups[g].desc;
      if(d === V6_DEFAULT_DESC[g] || PREV_DEFAULT_DESC[g].indexOf(d) !== -1) st.groups[g].desc = DEFAULT_DESC[g];

  }
  st.contentVersion = CONTENT_VERSION;
}

/* サーバーの index.html から最新の版番号を読み、いまの版より新しければ「再読み込み」のお知らせを出す */

  try{ if(navigator.serviceWorker && navigator.serviceWorker.getRegistration){ navigator.serviceWorker.getRegistration().then(function(r){ if(r) r.update().catch(function(){}); }).catch(function(){}); } }catch(e){}

function buildCsvText(){

  GROUP_ORDER.forEach(function(g){
    var grp = state.groups[g], label = GROUP_META[g].label;
    grp.locations.forEach(function(loc){ rows.push([label, "", "", loc, "", ""]); });   // locations first: keeps their order
    grp.items.forEach(function(it){ rows.push([label, it.name, it.checked ? "済" : "未", it.locations.join(";"), catLabel(it.cat), (it.have || []).join(";")]); });
  });

function parseCsvRows(text){
  text = String(text).replace(/^\uFEFF/, "");
  var firstLine = text.split(/\r\n|\n|\r/)[0] || "";
  var delim = ",";
  if(firstLine.indexOf(",") === -1){
    if(firstLine.indexOf("\t") !== -1) delim = "\t";
    else if(firstLine.indexOf(";") !== -1 && /^[^;]*;[^;]*;/.test(firstLine) && !/[0-9]次/.test(firstLine.split(";")[0] + "")) delim = ";";
  }
  var rows = [], row = [], field = "", inQ = false, i, c;
  for(i = 0; i < text.length; i++){
    c = text.charAt(i);
    if(inQ){
      if(c === '"'){ if(text.charAt(i + 1) === '"'){ field += '"'; i++; } else { inQ = false; } }
      else { field += c; }
    } else if(c === '"' && field === ""){ inQ = true; }
    else if(c === delim){ row.push(field); field = ""; }
    else if(c === "\r" || c === "\n"){
      if(c === "\r" && text.charAt(i + 1) === "\n") i++;
      row.push(field); rows.push(row); row = []; field = "";
    } else { field += c; }
  }
  if(field !== "" || row.length){ row.push(field); rows.push(row); }

}

  if(grp.locations.length >= MAX_LOCATIONS) return null;
  grp.locations.push(name);
  if(added) added.push(name);
  return name;
}
function checkWord(b){ return b ? "済" : "未"; }

function planCsvImport(text, mode, cur){
  cur = cur || state;
  var plan = { kind:"csv", mode:mode, ok:false, fatal:[], warnings:[], groups:[], skipped:[], totals:{ added:0, updated:0, removed:0, unchanged:0 }, changed:false, next:null };
  text = String(text == null ? "" : text).replace(/^\uFEFF/, "");
  if(!text.trim()){ plan.fatal.push("CSVの内容が空です。ファイルを選ぶか、CSVのテキストを貼り付けてください。"); return plan; }
  if(text.length > MAX_CSV_CHARS){ plan.fatal.push("データが大きすぎます(上限 約100万文字)。"); return plan; }
  if(text.indexOf("\u0000") !== -1){ plan.fatal.push("CSVファイルではないようです(Excelファイル .xlsx などは読み込めません。CSVで保存し直してください)。"); return plan; }
  if(text.indexOf("�") !== -1){ plan.fatal.push("文字化けしている部分があります。文字コードが合っていない可能性があります。Excelなら「CSV UTF-8(コンマ区切り)」で保存し直してください。"); return plan; }
  var t0 = text.trim().charAt(0);
  if(t0 === "{" || t0 === "["){
    try{ JSON.parse(text); plan.fatal.push("これはJSONバックアップです。CSVではありません。「全データのバックアップ(JSON)」の「データをインポート」から取り込んでください。"); return plan; }catch(e){}
  }
  var rows = parseCsvRows(text).map(function(r){ return r.map(function(c){ return /^'[=+\-@]/.test(c) ? c.slice(1) : c; }); });
  if(rows.length > MAX_CSV_ROWS){ plan.fatal.push("行数が多すぎます(上限 " + MAX_CSV_ROWS + "行)。"); return plan; }
  if(!rows.length){ plan.fatal.push("取り込める行がありません。"); return plan; }

  var cols = detectColumns(rows);
  if(cols.unknown){ plan.fatal.push("このCSVは形式が違うようです。1行目に「区分・品名・チェック・保管場所」の見出しが必要です(このアプリから書き出したCSVをご利用ください)。"); return plan; }
  var per = {};
  GROUP_ORDER.forEach(function(g){ per[g] = { present:false, entries:[], byKey:dict(), locOrder:[], locSeen:dict() }; });
  var unknownChecks = dict(), unknownCats = dict(), dupCount = 0, truncated = 0;
  function cellAt(r, i){ return i >= 0 && i < r.length ? r[i] : ""; }

  rows.forEach(function(r, i){
    if(i === 0 && cols.headerRow) return;
    var g = parseGroupKey(cellAt(r, cols.group));
    if(!g){
      plan.skipped.push({ row:i + 1, reason:"「区分」の列が 持ち歩き・持ち出し・備蓄 のどれでもありません(" + clampStr(String(cellAt(r, cols.group)).trim(), 12) + ")" });
      return;
    }
    var p = per[g];
    var rawName = String(cellAt(r, cols.name));
    var name = cleanLine(rawName, MAX_NAME);
    if(Array.from(rawName.trim()).length > MAX_NAME) truncated++;
    var locs = cols.hasLoc ? splitLocations(cellAt(r, cols.loc)) : [];
    locs.forEach(function(l){ var k = keyOf(l); if(!p.locSeen[k]){ p.locSeen[k] = true; p.locOrder.push(l); } });
    if(locs.length) p.present = true;
    if(!name) return;
    p.present = true;
    var chk = false;
    if(cols.hasCheck){
      var parsed = parseCheckedCell(cellAt(r, cols.check));
      if(parsed === null){ unknownChecks[String(cellAt(r, cols.check)).trim()] = true; parsed = false; }
      chk = parsed;
    }
    var haveList = cols.hasHave ? splitLocations(cellAt(r, cols.have)) : null;
    var catWord = cols.hasCat ? String(cellAt(r, cols.cat)).trim() : "";
    var cat = catWord ? parseCatWord(catWord) : "";
    if(catWord && !cat) unknownCats[clampStr(catWord, 8)] = true;
    var key = keyOf(name);
    var entry = { name:name, checked:chk, locs:locs, cat:cat, have:haveList };
    if(p.byKey[key]){ dupCount++; p.entries[p.byKey[key].idx] = entry; entry.idx = p.byKey[key].idx; p.byKey[key] = entry; }
    else { entry.idx = p.entries.length; p.entries.push(entry); p.byKey[key] = entry; }
  });

  if(!GROUP_ORDER.some(function(g){ return per[g].present; })){
    plan.fatal.push("取り込める行が見つかりませんでした。1列目に「持ち歩き」「持ち出し」「備蓄」のどれかが入った行が必要です。");
    if(plan.skipped.length) plan.fatal.push("認識できなかった行: " + plan.skipped.length + "行");
    return plan;
  }
  var totalEntries = 0;
  GROUP_ORDER.forEach(function(g){ totalEntries += per[g].entries.length; });
  if(mode === "overwrite" && totalEntries === 0){
    plan.fatal.push("防災用品が1件もないCSVで「上書き」すると、リストが空になってしまいます。取り込みを中止しました。");
    return plan;
  }

  // そろった場所: 「そろった場所」列があればそれを使う。なければ、チェックが「済」のとき全部そろった扱い(古いCSV)
  function haveFrom(e, locs, grp, existing){
    var out = [];
    if(cols.hasHave && e.have){
      e.have.forEach(function(l){ var at = findLoc(locs, l); if(at !== -1 && out.indexOf(locs[at]) === -1) out.push(locs[at]); });
    } else if(cols.hasCheck){
      if(e.checked) out = locs.slice();
    } else if(existing){
      (existing.have || []).forEach(function(l){ if(locs.indexOf(l) !== -1) out.push(l); });
    }
    return out;
  }
  var next = JSON.parse(JSON.stringify(cur));
  GROUP_ORDER.forEach(function(g){
    var p = per[g], info = { g:g, label:GROUP_META[g].label, present:p.present, added:[], updated:[], removed:[], unchanged:0, locAdded:[], locRemoved:[], capped:0 };
    plan.groups.push(info);
    if(!p.present) return;
    var grp = next.groups[g];
    var before = cur.groups[g].locations.slice();
    var curByKey = dict();
    grp.items.forEach(function(it){ var k = keyOf(it.name); if(!curByKey[k]) curByKey[k] = it; });

    if(mode === "overwrite" && p.locOrder.length){ grp.locations = []; }
    p.locOrder.forEach(function(l){ ensureLocation(grp, l, null); });

    var newItems = [];
    p.entries.forEach(function(e){
      var existing = curByKey[keyOf(e.name)];
      var resolved = [];
      e.locs.forEach(function(l){ var r = ensureLocation(grp, l, null); if(r && resolved.indexOf(r) === -1) resolved.push(r); });
      if(existing){
        var changes = [];
        var newLocs = cols.hasLoc ? resolved : existing.locations.slice();
        var newHave = haveFrom(e, newLocs, grp, existing);
        var newChecked = newLocs.length ? newHave.length === newLocs.length : (cols.hasCheck ? e.checked : existing.checked);
        if(newChecked !== existing.checked) changes.push("チェック " + checkWord(existing.checked) + "→" + checkWord(newChecked));
        if(!sameLocSet(existing.have || [], newHave)) changes.push("そろった場所 " + ((existing.have || []).join("・") || "なし") + "→" + (newHave.join("・") || "なし"));
        if(!sameLocSet(existing.locations, newLocs)) changes.push("保管場所 " + (existing.locations.join("・") || "なし") + "→" + (newLocs.join("・") || "なし"));
        if(cols.hasCat && e.cat && e.cat !== catKey(existing.cat)){ changes.push("分類 " + catLabel(catKey(existing.cat) || guessCat(existing.name)) + "→" + catLabel(e.cat)); existing.cat = e.cat; }
        if(changes.length) info.updated.push({ name:existing.name, changes:changes }); else info.unchanged++;
        existing.checked = newChecked;
        existing.locations = newLocs.filter(function(l){ return findLoc(grp.locations, l) !== -1; });
        existing.have = newHave.filter(function(l){ return existing.locations.indexOf(l) !== -1; });
        if(mode === "overwrite") newItems.push(existing);
      } else {
        if(grp.items.length + (mode === "overwrite" ? newItems.length : 0) >= MAX_ITEMS){ info.capped++; return; }
        var hv = haveFrom(e, resolved, grp, null);
        var it = { id:newId(), name:e.name, checked:resolved.length ? hv.length === resolved.length : (cols.hasCheck ? e.checked : false), cat:e.cat || guessCat(e.name), locations:resolved, have:hv };
        info.added.push(e.name);
        if(mode === "overwrite") newItems.push(it); else grp.items.push(it);
      }
    });
    if(mode === "overwrite"){
      var keep = dict();
      newItems.forEach(function(it){ keep[it.id] = true; });
      cur.groups[g].items.forEach(function(it){ if(!keep[it.id] && !isSameRef(newItems, it)) info.removed.push(it.name); });
      grp.items = newItems;
    }
    info.locAdded = grp.locations.filter(function(l){ return findLoc(before, l) === -1; });
    info.locRemoved = before.filter(function(l){ return findLoc(grp.locations, l) === -1; });
    plan.totals.added += info.added.length; plan.totals.updated += info.updated.length;
    plan.totals.removed += info.removed.length; plan.totals.unchanged += info.unchanged;
    if(info.added.length || info.updated.length || info.removed.length || info.locAdded.length || info.locRemoved.length) plan.changed = true;
  });
  function isSameRef(list, it){ return list.some(function(x){ return x.id === it.id; }); }

  if(plan.skipped.length){
    var ex = plan.skipped.slice(0, 3).map(function(s){ return s.row + "行目"; }).join("、");
    plan.warnings.push("認識できない行を " + plan.skipped.length + "行 スキップします(" + ex + (plan.skipped.length > 3 ? " など" : "") + ")。");
  }
  if(dupCount) plan.warnings.push("同じ区分の中に同じ名前の行が重複しています(" + dupCount + "件)。最後の行の内容を使います。");
  if(truncated) plan.warnings.push("長すぎる品名を " + truncated + "件、" + MAX_NAME + "文字に切り詰めます。");
  var unk = Object.keys(unknownChecks);
  if(unk.length) plan.warnings.push("チェック列に認識できない値があります(" + unk.slice(0, 3).map(function(u){ return "「" + clampStr(u, 8) + "」"; }).join("") + ")。未チェックとして扱います。");
  var unkCat = Object.keys(unknownCats);
  if(unkCat.length) plan.warnings.push("分類列に認識できない値があります(" + unkCat.slice(0, 3).map(function(u){ return "「" + u + "」"; }).join("") + ")。新しい用品は品名から自動で分け、すでにある用品は変更しません。");
  if(!cols.hasCat) plan.warnings.push("分類の列がないため、分類は変更しません(新しい用品は品名から自動で分けます)。");
  if(!cols.hasLoc) plan.warnings.push("保管場所の列がないため、保管場所は変更しません。");
  if(!cols.hasCheck) plan.warnings.push("チェックの列がないため、チェック状態は変更しません。");
  plan.groups.forEach(function(gi){ if(gi.capped) plan.warnings.push(gi.label + ": 1つの区分に登録できるのは " + MAX_ITEMS + "件までのため、" + gi.capped + "件は追加しません。"); });

  var clean = sanitizeState(next);
  if(!clean){ plan.fatal.push("取り込み結果を作れませんでした(内部エラー)。"); return plan; }
  clean.activeTab = cur.activeTab;
  plan.next = clean;
  plan.ok = true;
  return plan;
}

function planJsonImport(text, cur){
  cur = cur || state;
  var plan = { kind:"json", ok:false, fatal:[], warnings:[], counts:null, next:null };
  text = String(text == null ? "" : text).replace(/^\uFEFF/, "");
  if(!text.trim()){ plan.fatal.push("JSONの内容が空です。ファイルを選ぶか、テキストを貼り付けてください。"); return plan; }
  if(text.length > MAX_JSON_CHARS){ plan.fatal.push("データが大きすぎます。"); return plan; }
  if(text.indexOf("�") !== -1){ plan.fatal.push("文字化けしている部分があります。バックアップ時のファイルをそのまま選んでください。"); return plan; }
  if(text.trim().charAt(0) !== "{"){ plan.fatal.push("JSONバックアップではないようです。CSVの場合は「家族と共有(CSV)」の「CSVからインポート」を使ってください。"); return plan; }
  var parsed;
  try{ parsed = JSON.parse(text); }catch(e){ plan.fatal.push("JSONの形式が正しくありません(途中で切れている可能性があります)。"); return plan; }
  var next = sanitizeState(parsed);
  if(!next){ plan.fatal.push("このアプリのバックアップデータではないようです。"); return plan; }
  migrate(next);
  next.activeTab = cur.activeTab;
  plan.counts = GROUP_ORDER.map(function(g){ return { label:GROUP_META[g].label, now:cur.groups[g].items.length, after:next.groups[g].items.length, locs:next.groups[g].locations.length }; });
  plan.next = next;
  plan.ok = true;
  return plan;
}

function buildCsvPreviewHtml(plan){

    if(gi.removed.length) html += '<div class="pv-line"><span class="tag del">削除</span>' + listNames(gi.removed, 8) + '</div>';
    if(gi.locAdded.length) html += '<div class="pv-line"><span class="tag add">場所+</span>' + gi.locAdded.map(esc).join("、") + '</div>';
    if(gi.locRemoved.length) html += '<div class="pv-line"><span class="tag del">場所−</span>' + gi.locRemoved.map(esc).join("、") + '</div>';

function getGroup(t){
  var g = t.getAttribute("data-g");
  return GROUP_ORDER.indexOf(g) !== -1 ? g : state.activeTab;
}
function findItem(g, id){
  var items = state.groups[g].items;
  for(var i = 0; i < items.length; i++){ if(items[i].id === id) return items[i]; }
  return null;
}
function clearTransient(){ coachItemId = null; locEditorFor = null; editingDescG = null; openSwipeId = null; editingItemId = null; pendingDeleteId = null; pendingDeleteLoc = null; }
/* メモ・LINE・印刷向けの読み物(取り込み用ではありません)。非表示の用品は含めません。 */
function buildMarkdownText(){
  function one(v){ return String(v).replace(/[\r\n]+/g, " ").trim(); }
  var d = new Date();
  var out = ["# わが家の防災リスト", "", d.getFullYear() + "/" + pad2(d.getMonth() + 1) + "/" + pad2(d.getDate()) + " 時点", ""];
  GROUP_ORDER.forEach(function(g){
    var grp = state.groups[g], items = grp.items.filter(function(it){ return !it.hidden; });
    var done = items.filter(function(it){ return it.checked; }).length;
    out.push("## " + GROUP_META[g].label + "(" + done + "/" + items.length + ")", "");
    if(grp.desc) out.push(one(grp.desc), "");
    if(grp.locations.length) out.push("保管場所: " + grp.locations.map(one).join("、"), "");
    items.forEach(function(it){
      var locs = it.locations.length ? "(" + it.locations.map(one).join("・") + ")" : "";
      out.push("- [" + (it.checked ? "x" : " ") + "] " + one(it.name) + locs);
    });
    out.push("");
  });
  return out.join("\n").replace(/\n+$/, "\n");
}
function downloadFile(text, filename, mime, withBom){
  var blob = new Blob([(withBom ? "\uFEFF" : "") + text], { type:mime });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = filename; a.rel = "noopener";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}
function copyFrom(id){
  var ta = document.getElementById(id);
  if(!ta) return false;
  ta.focus(); ta.select();
  try{ ta.setSelectionRange(0, ta.value.length); }catch(e){}
  var ok = false;
  try{ ok = document.execCommand("copy"); }catch(e2){ ok = false; }
  return ok;
}

function readFileInto(file, target, after){
  if(file.size > MAX_FILE_BYTES){ target.msg = { type:"error", text:"ファイルが大きすぎます(上限 3MB)。" }; render(); return; }
  var reader = new FileReader();
  reader.onload = function(){
    var dec = decodeTextBuffer(new Uint8Array(reader.result));
    target.text = dec.text; target.enc = dec.enc; target.garbled = !!dec.garbled; target.file = file.name; target.msg = null;
    after();
  };
  reader.onerror = function(){ target.msg = { type:"error", text:"ファイルを読み込めませんでした。" }; render(); };
  reader.readAsArrayBuffer(file);
}

/* ---- reorder (drag the grip, or ArrowUp/ArrowDown on it) ---- */
function visibleIds(g){
  return state.groups[g].items.filter(isShown).map(function(it){ return it.id; });
}
/* move the item (by id) to position `to` among the items currently shown; hidden-away items keep their slots */
function reorderVisible(g, id, to){
  var grp = state.groups[g], vis = visibleIds(g), from = vis.indexOf(id);
  if(from === -1 || to < 0 || to >= vis.length || to === from) return false;
  var slots = [];
  grp.items.forEach(function(it, i){ if(vis.indexOf(it.id) !== -1) slots.push(i); });
  var byId = {}; grp.items.forEach(function(it){ byId[it.id] = it; });
  vis.splice(to, 0, vis.splice(from, 1)[0]);
  var out = grp.items.slice();
  slots.forEach(function(pos, k){ out[pos] = byId[vis[k]]; });
  grp.items = out;
  return true;
}
var drag = null;
function dragUpdate(){
  if(!drag) return;
  var y = drag.clientY + (window.pageYOffset || 0), dy = y - drag.y0;
  var r = drag.rects, f = drag.from;
  drag.el.style.transform = "translateY(" + dy + "px)";
  var center = r[f].top + r[f].h / 2 + dy, to = f;
  for(var i = 0; i < r.length; i++){
    if(i === f) continue;
    var mid = r[i].top + r[i].h / 2;
    if(i > f && center > mid) to = Math.max(to, i);
    if(i < f && center < mid) to = Math.min(to, i);
  }
  drag.to = to;
  for(var j = 0; j < drag.els.length; j++){
    if(j === f) continue;
    var shift = 0;
    if(f < to && j > f && j <= to) shift = -r[f].h;
    if(f > to && j >= to && j < f) shift = r[f].h;
    drag.els[j].style.transform = shift ? "translateY(" + shift + "px)" : "";
  }
}
function dragLoop(){
  if(!drag) return;
  var vh = window.innerHeight || 600, step = 0;
  if(drag.clientY < 70) step = -14; else if(drag.clientY > vh - 70) step = 14;
  if(step){ window.scrollBy(0, step); dragUpdate(); }
  drag.raf = window.requestAnimationFrame(dragLoop);
}
function dragCleanup(){
  if(!drag) return;
  if(drag.raf) window.cancelAnimationFrame(drag.raf);
  drag.els.forEach(function(el){ el.style.transform = ""; el.classList.remove("drag-lifted"); });
  if(drag.list) drag.list.classList.remove("dragging-list");
  drag = null;
}
appEl.addEventListener("pointerdown", function(e){
  if(e.pointerType === "mouse" && e.button !== 0) return;
  var h = e.target && e.target.closest ? e.target.closest(".drag-handle") : null;
  if(!h) return;
  var itemEl = h.closest(".item"), list = itemEl && itemEl.parentNode;
  if(!itemEl || !list) return;
  e.preventDefault();
  closeSwipe();
  var els = Array.prototype.filter.call(list.children, function(c){ return c.classList.contains("item"); });
  var from = els.indexOf(itemEl); if(from === -1) return;
  var sy = window.pageYOffset || 0;
  var rects = els.map(function(el){ var b = el.getBoundingClientRect(); return { top:b.top + sy, h:b.height }; });
  drag = { pid:e.pointerId, g:h.getAttribute("data-g"), id:h.getAttribute("data-drag-id"), el:itemEl, els:els, list:list, rects:rects, from:from, to:from, y0:e.clientY + sy, clientY:e.clientY, raf:0 };
  itemEl.classList.add("drag-lifted"); list.classList.add("dragging-list");
  try{ h.setPointerCapture(e.pointerId); }catch(err){}
  drag.raf = window.requestAnimationFrame(dragLoop);
});
appEl.addEventListener("pointermove", function(e){
  if(!drag || e.pointerId !== drag.pid) return;
  e.preventDefault();
  drag.clientY = e.clientY; dragUpdate();
});
function finishDrag(e, cancel){
  if(!drag || e.pointerId !== drag.pid) return;
  var d = drag, moved = !cancel && d.to !== d.from;
  dragCleanup();
  if(moved && GROUP_ORDER.indexOf(d.g) !== -1 && reorderVisible(d.g, d.id, d.to)){ render(); save(); }
}
appEl.addEventListener("pointerup", function(e){ finishDrag(e, false); });
appEl.addEventListener("pointercancel", function(e){ finishDrag(e, true); });
appEl.addEventListener("keydown", function(e){
  var t = e.target;
  if(!t || !t.classList || !t.classList.contains("drag-handle")) return;
  var delta = e.key === "ArrowUp" ? -1 : e.key === "ArrowDown" ? 1 : 0;
  if(!delta) return;
  e.preventDefault();
  var g = t.getAttribute("data-g"), id = t.getAttribute("data-drag-id");
  if(GROUP_ORDER.indexOf(g) === -1) return;
  var at = visibleIds(g).indexOf(id);
  if(reorderVisible(g, id, at + delta)){
    render(); save();
    var again = appEl.querySelector('.drag-handle[data-drag-id="' + id + '"]');
    if(again){ try{ again.focus(); }catch(err){} }
  }
});

    if(list[i].getAttribute("data-swipe-id") === id){
      var wrap = list[i].parentNode;
      return { content:list[i], btn:wrap.querySelector(".swipe-del"), pinBtn:wrap.querySelector(".swipe-pin") };
    }
  }
  return null;
}
function setSwipeOpen(id, open, side){
  var els = swipeEls(id);
  if(!els) return;
  side = side || "r";
  els.content.classList.remove("dragging");
  els.content.style.transform = "";
  els.content.classList.toggle("open", !!open && side === "r");
  els.content.classList.toggle("open-l", !!open && side === "l");
  if(els.btn){ els.btn.setAttribute("tabindex", open && side === "r" ? "0" : "-1"); els.btn.setAttribute("aria-hidden", open && side === "r" ? "false" : "true"); }
  if(els.pinBtn){ els.pinBtn.setAttribute("tabindex", open && side === "l" ? "0" : "-1"); els.pinBtn.setAttribute("aria-hidden", open && side === "l" ? "false" : "true"); }
}
function closeSwipe(){
  if(!openSwipeId) return;
  var id = openSwipeId; openSwipeId = null;
  setSwipeOpen(id, false);
}
function swipeOffset(sw, x){ return Math.max(sw.noLeft ? 0 : -OPEN_W - 24, Math.min(sw.pin ? OPEN_W + 24 : 0, sw.base + (x - sw.x0))); }

appEl.addEventListener("pointerdown", function(e){
  if(e.pointerType === "mouse" && e.button !== 0) return;
  var target = e.target;
  if(!target || !target.closest) return;
  var content = target.closest(".swipe-content");
  var onDel = !!target.closest(".swipe-del, .swipe-pin");
  if(openSwipeId && !onDel && (!content || content.getAttribute("data-swipe-id") !== openSwipeId)) closeSwipe();
  if(!content || onDel || content.getAttribute("data-noswipe") || target.closest("input,textarea,.drag-handle")) return;
  var id = content.getAttribute("data-swipe-id");
  swipe = { id:id, el:content, pid:e.pointerId, x0:e.clientX, y0:e.clientY, pin:!!content.getAttribute("data-pin"), noLeft:!!content.getAttribute("data-noleft"), base:(openSwipeId === id ? (openSwipeSide === "l" ? OPEN_W : -OPEN_W) : 0), dragging:false, off:0 };
});
appEl.addEventListener("pointermove", function(e){
  if(!swipe || e.pointerId !== swipe.pid) return;
  var dx = e.clientX - swipe.x0, dy = e.clientY - swipe.y0;
  if(!swipe.dragging){
    if(Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)){ swipe = null; return; }       // vertical scroll wins
    if(Math.abs(dx) <= 8 || Math.abs(dx) <= Math.abs(dy)) return;
    swipe.dragging = true;
    try{ swipe.el.setPointerCapture(e.pointerId); }catch(err){}
    swipe.el.classList.add("dragging");
  }
  swipe.off = swipeOffset(swipe, e.clientX);
  swipe.el.style.transform = "translateX(" + swipe.off + "px)";
});
function finishSwipe(e){
  if(!swipe || e.pointerId !== swipe.pid) return;
  var sw = swipe; swipe = null;
  if(!sw.dragging) return;
  suppressClickUntil = Date.now() + 400;   // マウスでドラッグした直後の「クリック」で閉じ直さない
  try{ sw.el.releasePointerCapture(e.pointerId); }catch(err){}
  var side = !sw.noLeft && sw.off < -OPEN_W * 0.45 ? "r" : (sw.pin && sw.off > OPEN_W * 0.45 ? "l" : null);
  if(side){
    if(openSwipeId && openSwipeId !== sw.id) closeSwipe();
    openSwipeId = sw.id; openSwipeSide = side; setSwipeOpen(sw.id, true, side);
  } else {
    if(openSwipeId === sw.id) openSwipeId = null;
    setSwipeOpen(sw.id, false);
  }
}
appEl.addEventListener("pointerup", finishSwipe);
appEl.addEventListener("pointercancel", finishSwipe);

/* ================= Boot ================= */
window.BousaiApp = {
  buildMarkdownText:buildMarkdownText,
  version:APP_VERSION, versionDate:APP_VERSION_DATE,
  sanitizeState:sanitizeState, planCsvImport:planCsvImport, planJsonImport:planJsonImport,
  buildCsvText:buildCsvText, parseCsvRows:parseCsvRows, decodeTextBuffer:decodeTextBuffer,
  migrate:migrate, defaultData:defaultData,
  getState:function(){ return state; }
};

loadThemePref();
load().catch(function(err){
  appEl.innerHTML = '<div class="empty">読み込み中にエラーが発生しました。ページを再読み込みしてください。</div>';
  console.error(err);
});

document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "visible" && Date.now() - lastUpdateCheck > 20 * 1000) checkForUpdate(false);
});
window.addEventListener("pageshow", function(e){ if(e.persisted && Date.now() - lastUpdateCheck > 20 * 1000) checkForUpdate(false); });
setInterval(function(){ if(document.visibilityState === "visible" && Date.now() - lastUpdateCheck > UPDATE_CHECK_MS - 5000) checkForUpdate(false); }, 60 * 1000);
if("serviceWorker" in navigator){
  var hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", function(){ if(hadController && !swUpdated){ swUpdated = true; render(); } });
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("service-worker.js").catch(function(e){ console.error("service worker registration failed", e); });
  });
}
try{ if(navigator.storage && navigator.storage.persist){ navigator.storage.persist(); } }catch(e){}

})();
</script>
